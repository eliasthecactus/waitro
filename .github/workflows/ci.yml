name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/package-lock.json
            web/package-lock.json
      - name: Validate catalog and run tests
        run: npm ci && npm test
        working-directory: tools
      - name: Build web app
        run: npm ci --no-audit --no-fund && npx ng build
        working-directory: web
