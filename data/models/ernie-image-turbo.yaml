id: ernie-image-turbo
name: ERNIE-Image-Turbo
org: Baidu
released: 2026-04-02
dateSource: huggingface
summary: Baidu's distilled 8B single-stream Diffusion Transformer for fast text-to-image generation with strong instruction following and text rendering in only 8 inference steps.
description: ERNIE-Image-Turbo is an open text-to-image model from Baidu's ERNIE-Image team. It is the distilled release of ERNIE-Image, built on the same single-stream Diffusion Transformer (DiT) family and tuned with DMD and RL for generation in 8 inference steps. Per the authors it is especially strong on complex instruction following, dense text rendering and structured layouts such as posters, comics and multi-panel compositions.
tasks:
  - image-generation
architecture: transformer
access: open-weights
license:
  id: Apache-2.0
  commercial: yes
io:
  in:
    - text
  out:
    - image
params:
  total: 8.03
hardware:
  platforms:
    - cuda
  note: Runs on consumer GPUs with 24GB VRAM per the model card; reference code uses bfloat16 on CUDA.
links:
  weights: https://huggingface.co/baidu/ERNIE-Image-Turbo
strengths:
  - Generates images in only 8 inference steps thanks to DMD and RL distillation
  - Strong on dense and layout-sensitive text rendering
  - Handles complex multi-object prompts and structured layouts like posters and comics
limitations:
  - Requires a GPU with roughly 24GB VRAM for the recommended setup
  - Output resolution is limited to the listed aspect-ratio buckets such as 1024x1024 and 848x1264
notes: Drafted from the model card; date, licence and size taken from Hugging Face/GitHub metadata.
