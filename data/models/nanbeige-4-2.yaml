summary: Nanbeige4.2-3B-Base is a 4.17B-parameter base language model trained from scratch using a Looped Transformer architecture and a 28T-token recipe weighted toward math and code.
description: A base (non-instruction-tuned) text-generation model from the Nanbeige4 series. It uses a Looped Transformer design in which hidden states are fed back through the same layers after a bottom-to-top pass, increasing capacity without adding parameters. Training data was expanded from 23T to 28T tokens with aggressive upsampling of math, code, STEM and synthetic-QA data. The card reports benchmark results on GSM8K, BBH, MBPP, MMLU-Pro, SuperGPQA and GPQA, comparing against Gemma4-E4B-Base, Qwen3.5-4B-Base and Nanbeige4.1-3B-Base. Loading requires trust_remote_code with the accompanying modeling_nanbeige.py.
