summary: Qwen3-TTS is a 1.92B-parameter open-weights text-to-speech model family with a discrete multi-codebook LM architecture streaming synthesis and instruction-based voice control across ten languages.
description: Qwen3-TTS is an end-to-end text-to-speech model family from Alibaba's Qwen team. It covers Chinese English Japanese Korean German French Russian Portuguese Spanish and Italian and supports instruction-driven control of timbre emotion and prosody. The released family includes CustomVoice VoiceDesign and Base models in 1.7B and 0.6B sizes with streaming and non-streaming generation.
