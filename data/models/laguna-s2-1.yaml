id: laguna-s2-1
name: Laguna S2.1
org: Poolside
released: 2026-07-13
dateSource: huggingface
summary: Laguna S 2.1 is a 118B-parameter Mixture-of-Experts text model from Poolside with about 8B active parameters per token designed for agentic coding and long-horizon software engineering.
description: Laguna S 2.1 is a 118B total parameter Mixture-of-Experts model with approximately 8B activated parameters per token. It uses 256 routed experts plus one shared expert with a token-choice router and softplus gating, grouped-query attention, and a mixed full/sliding-window attention layout across 48 layers. The model supports a 1,048,576-token context window, native interleaved reasoning with preserved thinking, and tool calling. Quantized variants include FP8, NVFP4, INT4, and GGUF, with a DFlash draft model available for speculative decoding.
