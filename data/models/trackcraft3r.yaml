description: TrackCraft3R is a dense 3D tracking model that repurposes a pre-trained Wan2.1-T2V-1.3B video diffusion transformer to predict dense per-pixel 3D trajectories from a monocular video plus depth and camera in a single forward pass.
tasks:
  - image-understanding
  - depth-estimation
architecture: diffusion
