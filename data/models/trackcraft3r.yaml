license:
  id: Apache-2.0
  commercial: yes
io:
  in:
    - video
    - depth
    - structured
  out:
    - 3d
    - depth
params:
  total: 8.88
hardware:
  platforms:
    - cuda
links:
  repo: https://github.com/cvlab-kaist/TrackCraft3r
  weights: https://huggingface.co/trackcraft3r/checkpoint
strengths:
  - Single forward pass produces dense per-pixel 3D trajectories and depth back-projections
  - Trained checkpoint and training code released under Apache-2.0
  - Built on the public Wan2.1-T2V-1.3B video diffusion backbone
limitations:
  - Requires predicted depth and camera from an external preprocessor such as DA3 or ViPE
  - Training setup assumes 8 x NVIDIA H200 GPUs with CUDA 12.1
  - Trained on synthetic datasets (Kubric Dynamic Replica PointOdyssey TartanAir)
