summary: Google DeepMind's real-time interactive world model. Generates explorable worlds with native audio that you steer with prompts, keyboard and mouse.
description: Natively multimodal world model that generates video with ambient sound, music and dialogue as you move through it, and accepts new prompts mid-session to change weather, add characters or redirect action. Gemini plans multi-step events. Announced as a research preview on 2026-10-27; since 2026-11-18 available to eligible Google AI Ultra subscribers in Project Genie (Pro members can join a waitlist), with Gemini API early access for partners.
