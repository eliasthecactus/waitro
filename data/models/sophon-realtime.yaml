  - { name: E2E, weights: https://huggingface.co/adventists-ai/Sophon-Realtime-32B-E2E }
  - { name: Flash 4-bit MLX, weights: https://huggingface.co/adventists-ai/Sophon-Realtime-32B-Flash-4bit-MLX }
