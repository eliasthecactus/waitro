links:
  weights: https://huggingface.co/Edge0/Audio8-TTS-Preview-0.1b
strengths:
  - Zero-shot voice cloning from a reference clip and its transcript
  - Bundled 44.1 kHz neural audio codec requires no extra checkpoint
  - CPU ONNX INT8 build runs without PyTorch at low memory
limitations:
  - Compact preview checkpoint with weaker and more variable quality outside Chinese and English
  - Long noisy or mis-transcribed reference audio reduces stability and speaker similarity
  - Commercial use excluded for entities with annual revenue of US$2M or more
