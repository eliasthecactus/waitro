dateSource: huggingface
summary: Audio8 TTS 0.1B is a compact autoregressive text-to-speech model with roughly 170M main parameters plus a bundled ~120M-parameter neural audio codec that generates 44.1 kHz speech and supports…
description: "Audio8 TTS Preview 0.1B is a small zero-shot TTS checkpoint built on an Audio8 Falcon H1 architecture with slow and fast autoregressive branches: the slow branch predicts semantic tokens while the fast branch predicts 10 codec codebooks (4,096 entries each) conditioned on the slow hidden state. The slow AR has 24 layers and the fast AR 4 layers, both at width 512 with 8 attention heads and 2 KV heads, and context runs up to 2,048 packed text/audio positions. The repository includes the complete v4 mixed checkpoint, tokenizer, processor, codec (codec.pth) and Hugging Face remote code, so no separate codec download is needed. Chinese and English are the primary languages, with German, Spanish, French, Italian, Japanese and Korean listed as experimental/multilingual evaluation languages. Synthesis works with or without a reference clip: supplying reference audio plus its transcript performs zero-shot voice cloning. An ONNX INT8 package targets low-resource CPU inference with ONNX Runtime, using per-token INT8 graphs for the slow and fast AR and FP16 for the codec, loading at about 0.4 GiB in the tested Linux x86_64 configuration. Python 3.11+ with a CUDA-capable GPU is recommended for the PyTorch path."
