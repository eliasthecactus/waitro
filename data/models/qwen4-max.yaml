summary: Alibaba's first Qwen4 flagship, a 2.4T-parameter MoE with native vision. API only, unlike the open Qwen3.8 Max.
description: Sparse MoE with 2.4T total and 71B active parameters per token (25% fewer active than Qwen3.8-Max). Built for coding, agents and visual reasoning. Available through the Qwen Cloud API and Token Plan, QwenWork and QwenStudio. Alibaba says smaller open-weight Qwen4 models will follow, with no date. API id qwen4-max.
