dateSource: huggingface
summary: Kimi K2.7 Code is a 1T-parameter Mixture-of-Experts (32B activated) coding-focused agentic model from Moonshot AI with a 256K context and a MoonViT vision encoder for image and video input.
description: Kimi K2.7 Code is a coding-focused agentic model built on Kimi K2.6 and aimed at long-horizon software engineering workflows, with roughly 30% lower thinking-token usage than K2.6. It is a 61-layer MoE with 384 experts (8 selected per token plus 1 shared), 1T total and 32B activated parameters, MLA attention and a 160K vocabulary, supporting a 256K context length. A 400M-parameter MoonViT encoder adds image and video input, and the model uses native int4 quantization. Recommended inference engines are vLLM, SGLang and KTransformers; an OpenAI/Anthropic-compatible API is also offered.
