dateSource: huggingface
summary: Carbon-X is a 14.8B-parameter decoder-only language model trained jointly on DNA sequences and natural language that answers questions about variants and genomic sequences in an ordinary chat…
description: Carbon-X is an open-weight decoder-only language model from the Carbon family. It has 14.8B parameters, 40 layers, hidden size 5120, GQA with 40 query heads and 8 KV heads, SwiGLU, and RMSNorm with QK-norm. Its hybrid tokenizer keeps the Qwen3 BPE vocabulary for text and encodes DNA as non-overlapping 6-mers so that one DNA token covers 6 base pairs, with 1,364 tail tokens that let sequences of any length decode back exactly. The model was trained on 302B tokens (DNA, biology text, English and instruction data) followed by supervised fine-tuning and reinforcement learning with verifiable rewards. It supports a 40,960-token context window, serves with vLLM on a single GPU, and should be run with enable_thinking=False. It reports an average of 66.7% across five DNA benchmarks with thinking disabled.
