strengths:
  - Reports 66.7% average over five DNA benchmarks with thinking disabled
  - Fits on one 80 GB GPU in bfloat16 keeping sequences on local infrastructure
  - Hybrid tokenizer keeps text BPE while DNA 6-mers decode back exactly
limitations:
  - Post-trained and evaluated with thinking disabled rather than extended reasoning
  - Bases other than A C G T such as N collapse to a single token losing resolution
  - Needs Transformers v5 or later and trust_remote_code for the tokenizer
