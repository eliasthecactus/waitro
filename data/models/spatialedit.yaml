strengths:
  - Fine-grained spatial editing of object motion rotation 3D viewpoint framing and camera movement
  - Released 16B checkpoints plus SpatialEdit-500K training data and SpatialEdit-Bench evaluation suite
  - MIT-licensed
limitations:
  - Requires external VGGT YOLO26x Qwen3-VL-8B-Instruct and Wan2.1 VAE checkpoints for evaluation and inference
  - Configs and scripts contain placeholder or internal paths that must be updated before running
  - CUDA and flash_attn environment required
