id: spatialedit
name: SpatialEdit
org: Unknown
released: 2026-03-30
dateSource: github
summary: SpatialEdit-16B is a 16B-parameter image spatial editing model for fine-grained camera and object manipulation with a companion benchmark and synthetic training set.
description: SpatialEdit focuses on spatially grounded image editing to control object motion rotation 3D viewpoint framing and camera movement. It includes SpatialEdit-Bench for evaluating perceptual plausibility and geometric fidelity and SpatialEdit-500K a synthetic Blender-rendered training set. The released SpatialEdit-16B checkpoint is described as a baseline model for fine-grained spatial editing.
