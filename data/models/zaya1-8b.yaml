  active: 0.76
contextTokens: 262144
hardware:
  platforms:
    - cuda
  note: Served via a fork of vLLM (`zaya1-pr` branch) and a fork of transformers (`zaya1` branch); the card recommends DP with EP for parallelism because TP is unsupported in that branch.
links:
  weights: https://huggingface.co/Zyphra/ZAYA1-8B
