summary: ZAYA1-8B is an 8.4B-total / ~0.76B-active mixture-of-experts language model from Zyphra post-trained for long-form reasoning and especially strong at math and coding for its size.
description: ZAYA1-8B is a small mixture-of-experts reasoning language model from Zyphra with roughly 0.76B active and 8.4B total parameters. It targets long-form chain-of-thought work and is tuned for math and coding, where Zyphra reports it competing with models several times larger. The card also notes that its small total size makes it viable for on-device local LLM use.
