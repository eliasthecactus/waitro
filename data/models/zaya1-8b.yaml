strengths:
  - Only around 0.76B active parameters while carrying 8.4B total
  - Tuned for detailed long-form reasoning on math and coding tasks
limitations:
  - Requires Zyphra's forked vLLM or transformers builds; stock libraries may not load the architecture
  - Reported comparison scores for other models were produced on Zyphra's own evaluation harness
