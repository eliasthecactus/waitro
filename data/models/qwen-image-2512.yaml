summary: Qwen-Image-2512 is a 20.43B-parameter text-to-image diffusion model from Alibaba Qwen and the December update to Qwen-Image with improved human realism natural detail and text rendering.
description: Qwen-Image-2512 is the December update of Alibaba Qwen's text-to-image foundational model. It improves human realism and fine natural detail while also improving text rendering and multimodal text-image composition. It is released under Apache-2.0 and can be run with the diffusers DiffusionPipeline on CUDA or CPU.
