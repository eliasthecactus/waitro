id: gemini-4-hydrogen
name: Gemini 4 Hydrogen
org: Google
released: 2026-11-12
dateSource: vendor
summary: Fast, cheaper Gemini 4 model for everyday coding and agentic work, with four thinking levels and a flat-priced 1M context. Replaces Gemini 3.8 Flash.
description: Hydrogen is built for rapid execution, either on its own or as the worker and verifier next to Carbon or Argon in multi-model setups (Orchestrator in Google Antigravity). Thinking levels are low, medium, high (default) and xhigh. Google reports 2.5x faster task completion than Gemini 3.8 Flash and more than 5x fewer fabricated claims. Available on all tiers of AI Studio and the Gemini API, the Gemini app and Search.
