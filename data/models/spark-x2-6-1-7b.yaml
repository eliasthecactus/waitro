id: spark-x2-6-1-7b
name: Spark-X2.6-1.7B
org: XHToken
released: 2026-10-19
dateSource: huggingface
summary: A 1.71B-parameter compact general-purpose transformer language model for on-device deployment with configurable thinking levels and long-context support.
description: Spark-X2.6-1.7B is the second model in XHToken's Spark-X2.6 series and follows Spark-X2.5-1.7B, retaining exactly the same architecture while gaining capability through improved post-training. The card reports improvements in coding, agentic tool use, long-context reasoning, multilingual and general tasks, plus leading decoding throughput among similarly sized on-device models it was compared against. It offers three configurable thinking levels (none, low, high); switching from high to low reduces the average score by 4.0 points while cutting average output length by 37.3%. Weights and configuration files are released in Hugging Face Transformers format (transformers==4.57.1) and the card documents serving with SGLang and vLLM on NVIDIA GPUs and Ascend NPUs, plus an optimized llama.cpp implementation.
