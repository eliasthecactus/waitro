links:
  weights: https://huggingface.co/XHToken/Spark-X2.6-1.7B
strengths:
  - Same architecture as Spark-X2.5-1.7B with capability gains from improved post-training
  - Configurable thinking budget (none / low / high) to trade quality for latency and cost
  - Reported leading decoding throughput among comparable on-device models at shorter context lengths
limitations:
  - The full 1 ·048 ·576-token context setting requires sufficient device memory
  - Transformers usage pins transformers==4.57.1 with trust_remote_code
