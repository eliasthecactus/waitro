dateSource: huggingface
summary: MolmoAct2 is an open vision-language-action model that couples a Molmo2-ER embodied-reasoning VLM backbone to a flow-matching continuous action expert via per-layer KV conditioning.
description: The checkpoint is a post-trained multi-embodiment foundation model for robot control. It maps visual observations and language instructions to continuous robot actions. It ships VLM and action-expert weights plus normalization metadata for the post-training mixture. It is intended for further fine-tuning on a target embodiment rather than direct deployment.
