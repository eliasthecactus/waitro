strengths:
  - Combines an embodied-reasoning VLM backbone with a continuous action expert via per-layer KV conditioning
  - Post-trained across multiple embodiments with normalization stats supplied for the post-training mixture
  - Repositories include data and fine-tuned checkpoints for LIBERO DROID BimanualYAM and SO100/101
limitations:
  - Must be fine-tuned before use as a deployable robot policy
  - Behavior can vary across embodiments environments and hardware so outputs require safety validation
