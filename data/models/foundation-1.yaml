summary: Foundation-1 is a family of text-conditioned audio models fine-tuned from Stable Audio Open 1.0 that generates tempo- and key-aware musical loops one-shots and pitch-consistent keybeds for music…
description: Foundation-1 is a family of text-conditioned audio models designed around music production workflows. Rather than treating audio generation as broad caption-to-music generation, Foundation-1 was trained around structured controls for instrument identity, timbre, FX, musical behavior, pitch, timing, and tonality. The original Foundation-1 checkpoint focuses on structured loop generation. Newer specialized checkpoints extend the same conditioning system into individual one-shots and pitch-consistent playable keybeds.
