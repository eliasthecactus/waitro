  weights: https://huggingface.co/RoyalCities/Foundation-1
strengths:
  - Layered conditioning separates instrument family sub-family timbre FX and notation/structure tags
  - Understands BPM and bar count and locks to major and minor keys for structured loops
  - Generates pitch-consistent multi-note keybeds that can be assembled into playable sampler instruments
limitations:
  - Keybed specialization trades off broader loop-generation quality versus the earlier Samples checkpoint
  - Commercial use above USD $1M annual revenue requires a separate Stability AI enterprise license
  - Best used with RC Stable Audio Tools for the multi-note keybed workflow and instrument assembly
