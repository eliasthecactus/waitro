summary: "Lumos-Custom is an umbrella repository from Alibaba DAMO Academy bundling three open research video projects: LumosX for identity- and attribute-aware personalized video generation, UniLumos for…"
description: Lumos-Custom collects separate self-contained subprojects for customized video generation. LumosX (ICLR 2026) targets personalized multi-subject video generation, using a data pipeline that builds relational structure from captions and MLLM priors plus Relational Self-Attention and Relational Cross-Attention to model subject-attribute dependencies; weights are published on Hugging Face. UniLumos (NeurIPS 2025) performs unified image and video relighting on a flow-matching backbone with depth and normal maps as geometry feedback and path consistency learning for few-step training; weights are also on Hugging Face. Lumos-Nexus (arXiv preprint) is a training-efficient unified video generation framework where a lightweight generator is aligned with an understanding block and Unified Progressive Frequency Bridging hands off at inference to a high-capacity pretrained generator in a shared latent space. Each subproject ships its own installation and inference instructions, and two companion benchmarks (LumosBench and VR-Bench) accompany the releases.
