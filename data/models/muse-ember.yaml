id: muse-ember
name: Muse Ember
org: Meta
summary: Meta's smallest Muse reasoning model, for high-volume agent work like tool calls, coding subtasks, routing and document extraction. 1M context, multimodal input.
description: Muse Ember is meant to run as the cheap execution or subagent model next to Muse Wonder and Muse Spark. It takes text, image, audio and video input. Available on the Meta Model API (OpenAI SDK compatible) as muse-ember-1.0, in Muse Code and on OpenRouter. Weights are not released.
