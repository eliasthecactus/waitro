description: WeVisOne-VL is a unified vision-language model developed by WeChat Vision at Tencent Inc. and built upon Qwen3-VL. It combines object-level perception (open-vocabulary object detection referring localization object counting object pointing and OCR) with pixel-level perception (referring segmentation and promptable alpha matting) through structured next-token prediction and a lightweight 9.6M-parameter pixel decoder. The release is intended for research in visual grounding referring localization pointing counting OCR localization referring segmentation and image matting.
