  homepage: https://tencent.github.io/WeVisOne-VL/
strengths:
  - Unifies open-vocabulary object detection referring localization counting pointing and OCR with referring segmentation and promptable alpha matting in one model
  - Uses structured next-token prediction with dedicated coordinate tokens and a 9.6M-parameter pixel decoder for dense outputs
  - Released as open weights under Apache-2.0 for research use
limitations:
  - Alpha matte quality is sensitive to image resolution severe occlusion complex transparency and prompt phrasing
  - Generates structured outputs without explicit chain-of-thought and targets single-turn image perception; video grids are rejected by the pixel decoder
  - Not intended for autonomous high-impact decisions or identifying individuals
