id: novaatom-lite
name: NovaAtom-Lite
org: Geodesic Intelligence
released: 2026-11-10
dateSource: vendor
summary: All-atom structure prediction for proteins, DNA, RNA and ligands. Beats AlphaFold 3 and IsoDDE on antibody–antigen and protein–ligand interfaces (vendor runs).
description: Given protein, DNA and RNA chains plus small-molecule ligands (by component code or SMILES), NovaAtom-Lite predicts every heavy atom with pLDDT, PAE and ipTM confidence. It accepts cyclic and covalent bonds and contact or pocket hints. Training cutoff 2021-09-30, the same as AlphaFold 3. Available through the Geodesic API and the no-code NovaDDE platform.
tasks: [life-sciences]
