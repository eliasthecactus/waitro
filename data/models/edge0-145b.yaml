id: edge0-145b
name: Edge0-145B
org: Edge0
released: 2026-11-12
dateSource: vendor
summary: Open-weights 145B MoE (about 10B active) rebuilt from Qwen3.8-Flash-Next to run on one consumer NVIDIA GPU or a Mac, for local coding and agent work.
description: "Edge0 rebuilt the expert layer of Qwen3.8-Flash-Next (48 layers, 512 experts, 10 routed plus 1 shared active, latent width 1792) and post-trained it natively at 4 bits. Shipped as Q3_K and NVFP4 weights run with Edge0's own edge0-infer engine. 256K context. Optional image input through a separate vision encoder."
tasks: [coding, agents, reasoning, chat]
architecture: moe-transformer
access: open-weights
license: { id: edge0-community-model-1.0, commercial: limited, note: "Outputs may be used commercially. Selling or hosting the model, or building commercial coding or office assistants on it, needs written permission from Edge0. Qwen Community License also applies." }
io: { in: [text, image], out: [text, code] }
params: { total: 145, active: 10.12 }
contextTokens: 262144
weightsSizeGB: 43.8
hardware: { platforms: [cuda, apple-silicon], note: "Measured on an RTX 5090 D 24 GB: 23.25 GiB VRAM plus 38.27 GiB RAM (NVFP4). Q3_K also tested with 12 GiB VRAM plus 20 GiB RAM using SSD streaming. Linux or Windows with CUDA 13, or macOS with Metal." }
