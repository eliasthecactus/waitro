summary: Meituan's native multimodal 1.6T MoE (about 48B active) for long-horizon agent work and coding. MIT-licensed open weights plus a hosted API.
description: Builds on LongCat-2.0 and combines visual understanding with agentic coding for codebase work, full-project builds, design and 3D tasks. Trained on Chinese AI accelerators; expert weights and activations use W4A4 quantization for native INT4 compute. Hosted on longcat.ai since 2026-11-02, weights on Hugging Face since 2026-11-09.
