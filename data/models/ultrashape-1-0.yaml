  out:
    - 3d
hardware:
  platforms:
    - cuda
  note: Official code uses PyTorch with CUDA 12.1; card lists CUDA-based inference and training plus low-VRAM options.
links:
  repo: https://github.com/PKU-YuanGroup/UltraShape-1.0
  homepage: https://pku-yuangroup.github.io/UltraShape-1.0/
strengths:
  - Two-stage coarse-to-refined 3D geometry pipeline
  - Voxel-based refinement at fixed spatial locations using RoPE positional anchors
  - Pre-trained weights and inference and training code released
limitations:
  - Refinement stage requires a coarse mesh generated by Hunyuan3D-2.1
  - Default DiT sampling uses 50 steps and can be reduced to 12
