id: ultrashape-1-0
name: UltraShape 1.0
org: PKU Yuan Group
released: 2025-12-23
dateSource: github
summary: UltraShape 1.0 is a diffusion-based 3D shape generation framework that refines coarse meshes into detailed high-quality geometry using a two-stage pipeline.
description: UltraShape 1.0 is a diffusion-based 3D shape generation framework that refines a coarse mesh into high-fidelity geometry through a two-stage generation pipeline.
tasks:
