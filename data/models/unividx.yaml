id: unividx
name: UniVidX
org: Kuaishou
released: 2026-05-02
dateSource: huggingface
summary: UniVidX is a unified multimodal video diffusion framework from Kuaishou with released checkpoints for intrinsic and alpha video generation across multiple modalities.
description: UniVidX is a unified multimodal video diffusion framework for versatile video generation and perception. It supports omni-directional conditional generation across multiple modalities by training a single model to handle different input-output mappings rather than one fixed task. The repository hosts released checkpoints for UniVid-Intrinsic covering RGB albedo irradiance and normal video modalities and UniVid-Alpha covering blended RGB video alpha matte foreground and background modalities.
