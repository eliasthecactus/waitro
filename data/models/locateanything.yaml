strengths:
  - Parallel Box Decoding predicts whole boxes and points in one step enabling up to 2.5x higher throughput per the authors
  - Trained on a large multi-domain grounding corpus spanning natural scenes robotics driving GUI and documents
  - Supports referring-expression grounding dense multi-object detection GUI element grounding and text localization
limitations:
  - Licensed for non-commercial research and evaluation use only
  - Inference runs through Transformers in BF16 and is targeted at NVIDIA GPUs on Linux
  - Released as a research and development model rather than a production deployment
