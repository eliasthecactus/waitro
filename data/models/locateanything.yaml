id: locateanything
name: LocateAnything
org: NVIDIA
released: 2026-03-02
dateSource: huggingface
summary: NVIDIA's 3B vision-language grounding model that uses Parallel Box Decoding to predict complete bounding boxes and points in one parallel step for fast object detection and localization.
description: LocateAnything is a 3B-parameter transformer vision-language model built from a MoonViT vision encoder and Qwen2.5-3B-Instruct language model with an MLP projector. Its core innovation is Parallel Box Decoding, a block-wise multi-token prediction scheme that emits complete bounding boxes and points instead of autoregressive coordinates; the authors report up to 2.5x higher throughput than prior approaches. It was trained on a multi-domain dataset of 12M images, 138M+ queries and 785M bounding boxes covering natural scenes, robotics, driving, GUI interaction and documents.
