description: Altar-1 is a 504B-parameter mixture-of-experts text model built by pruning GLM-5.3 from 256 to 168 experts per layer with REAP and quantizing the routed experts to INT4 W4A16 (328 GB). Only the routed experts are 4-bit while attention, the shared expert, dense layers and head stay BF16 with 8 of 168 experts active per token (~40B active). It is served with vLLM at tensor-parallel size 4 with a 131072-token maximum length and is calibrated on cybersecurity traces, coding, tool calling, reasoning and English plus multilingual Wikipedia. KL divergence against the full BF16 model is 0.506 nats and the REAP pruning keeps each domain's specialists rather than the globally most frequent experts. Weights are released on Hugging Face under the inherited GLM-5.3 license.
