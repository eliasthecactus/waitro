strengths:
  - Keeps 168 of 256 experts per layer with no retraining via router-weighted expert activation pruning (REAP)
  - Only routed experts are 4-bit; attention · shared expert · dense layers and head stay BF16
  - Domain-aware expert selection preserves specialists for code · rare languages and structured output
limitations:
  - Requires Hopper-class GPUs (H100/H200) and 328 GB of weights across 4x H200 in vLLM
  - "Pruned and INT4-quantized: KL divergence of 0.506 nats versus the full BF16 GLM-5.3"
