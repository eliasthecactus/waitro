id: id-lora
name: ID-LoRA
org: unknown
released: 2026-03-07
dateSource: github
summary: ID-LoRA is an in-context LoRA adapter for the LTX-2 audio-video diffusion model that generates an identity-preserving talking video from a text prompt, a first-frame image and a short reference…
description: ID-LoRA personalizes appearance and voice in a single generative pass, built on LTX-2 (19B) and LTX-2.3 (22B). Given a structured text prompt ([VISUAL], [SPEECH], [SOUNDS]), a first-frame image for face and scene conditioning, and a ~5 s reference audio clip, it produces a talking video whose voice matches the reference speaker and whose face matches the subject. Voice and appearance are synthesized jointly in a unified latent space rather than through a cascaded pipeline, and inference is zero-shot after loading the LoRA weights. One-stage and two-stage (2x spatial upsampling) inference are supported, along with int8 quantization, and ComfyUI integration exists via a custom node and upstream native support.
