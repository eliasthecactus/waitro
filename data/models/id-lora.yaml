strengths:
  - Generates voice and appearance jointly in one unified audio-video diffusion pass rather than a cascaded pipeline
  - "Zero-shot at inference: load the LoRA weights with no per-speaker fine-tuning"
  - Lightweight training footprint of ~3K pairs on a single GPU
  - Supports LTX-2 (19B) and LTX-2.3 (22B) with one-stage two-stage and Two-Stage HQ inference
limitations:
  - Reference audio should be approximately 5 seconds; shorter or longer clips may degrade voice identity transfer
  - Requires CUDA with 24+ GB VRAM and 48 GB recommended for two-stage inference
  - Licence is NOASSERTION with no licence text provided so commercial use terms are unclear
