links:
  weights: https://huggingface.co/Aratako/MioTTS-2.6B
strengths:
  - English and Japanese bilingual support
  - Zero-shot voice cloning from a short reference audio clip
  - Low RTF of 0.135-0.145 on NVIDIA RTX 5090 with vLLM
limitations:
