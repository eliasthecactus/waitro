id: miotts-2-6b
name: MioTTS-2.6B
org: Aratako
released: 2026-02-09
dateSource: huggingface
summary: MioTTS-2.6B is a lightweight 2.6B-parameter LLM-based text-to-speech model for English and Japanese with zero-shot voice cloning and low latency.
description: MioTTS-2.6B is a text-to-speech model built on an LLM architecture with zero-shot voice cloning and bilingual English/Japanese support. It uses the MioCodec-25Hz-24kHz audio codec and is initialized from LiquidAI/LFM2-2.6B.
