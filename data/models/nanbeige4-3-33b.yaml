summary: Nanbeige4.3-33B is a 33.12B-parameter open-weights text-generation model serving as the flagship teacher model of the Nanbeige4.3 series with a 524288-token context and configurable thinking and…
description: "Nanbeige4.3-33B is the flagship teacher model of the Nanbeige4.3 series which targets agentic performance among open models in the ~30B parameter class. It is positioned for complex coding and professional cowork tasks and is intended to anchor the later distillation of agentic capabilities into smaller models such as Nanbeige4.3-3B. The tokenizer exposes configurable chat-template controls: enable_thinking toggles reasoning output; preserve_thinking retains prior-turn reasoning (recommended True for multi-turn tool use and code-agent workflows); and passing tools enables the tool-use template with xml recommended over json for tool calling. The model supports up to 524288 tokens of context and can be served with Transformers, SGLang or vLLM using tensor parallelism. Recommended sampling is temperature 1.0 / top_p 0.95 with 65536 max new tokens for agentic and tool-use tasks and temperature 0.6 / top_p 0.95 with 262144 max new tokens for reasoning and chat."
