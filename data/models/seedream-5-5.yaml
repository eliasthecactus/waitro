summary: ByteDance's image generation and editing model, with consistent edits over 80+ rounds and native RGBA output with up to 100 editable layers. From about $0.02 per image.
description: Seedream 5.5 generates and edits images from text and up to 10 reference images. It keeps subjects, style and layout stable over many edit rounds, outputs full or semi-transparent RGBA assets split into up to 100 layers with editable text, and renders at 1K, 1.5K and 2K in PNG or JPEG.
