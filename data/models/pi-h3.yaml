id: pi-h3
name: pi-H3
org: Hansheng Chen (LakonLab)
released: 2026-11-10
dateSource: vendor
summary: Fastest MiniMax H3 variant. Makes video with audio in 2 or 4 steps and outputs pixels directly, skipping the VAE decoder. 5 s of 768p video in 3.8 s on a B200.
description: pi-H3 is a piFlow distillation of MiniMax H3 whose last denoising step predicts pixels (DWD), so no video VAE decode is needed. With FP8 it is 2.4x to 2.7x faster than Sol-H3 at 2 steps for 5 to 15 s clips, and the authors report better motion, texture and audio than other few-step H3 models. Hugging Face demo live; weights and inference code are due in LakonLab with ComfyUI support via ComfyUI-piFlow.
tasks: [video-generation]
