strengths:
  - Omnimodal generation and reasoning across text image video audio and action trajectories
  - Mixture-of-Transformers combines autoregressive token generation with diffusion denoising
  - Commercial use allowed under OpenMDW1.1 and optimized for NVIDIA Ampere/Blackwell/Hopper GPUs
limitations:
  - The Generator text input is capped at 4096 tokens · and video input is capped at 5 frames
  - Audio input is capped at 0.5 second · and only BF16 precision is officially tested
  - Requires NVIDIA Ampere/Blackwell/Hopper GPUs on Linux
