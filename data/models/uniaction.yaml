io:
  in:
    - image
    - structured
  out:
    - video
hardware:
  platforms:
    - cuda
  note: The official Wan2.2-I2V-A14B backbone is downloaded separately and retains its original license.
links:
  weights: https://huggingface.co/BowenXue/UniAction
  homepage: https://uniaction.github.io/
strengths:
  - Unified conditioning on force camera control hand pose and robot pose
  - Released as stage1 and stage2 safetensors with an inference example
  - Adapters are released under Apache License 2.0
limitations:
  - Requires the separately downloaded Wan2.2-I2V-A14B backbone
  - The backbone retains its original license
  - Training sources retain their respective terms
