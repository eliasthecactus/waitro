id: uniaction
name: UniAction
org: research project
released: 2026-10-26
dateSource: huggingface
summary: UniAction is a set of Apache-2.0 adapters that condition a shared Wan2.2-I2V-A14B video world model on force camera hand pose and robot pose inputs.
tasks:
  - video-generation
architecture: other
access: open-weights
license:
