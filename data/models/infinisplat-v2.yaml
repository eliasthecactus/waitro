summary: InfiniSplat v2 is a feed-forward 3D Gaussian splatting reconstruction model that turns multiple images (with or without camera poses) into 3D Gaussian scenes for novel-view rendering, alongside a…
description: InfiniSplat v2 reconstructs 3D Gaussian scenes from multiple images, with or without camera poses, for novel-view rendering. The repository also hosts InfiniSplat v1 which reconstructs 3D Gaussian scenes from a single RGB image optionally guided by LiDAR depth. Both versions are installed in separate Python environments because their dependencies and weights differ. A 360-degree panorama to 3DGS example is included.
