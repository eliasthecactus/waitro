links:
  weights: https://huggingface.co/ByteDance-Seed/UI-TARS-1.5-7B
strengths:
  - Supports GUI grounding and computer browser and phone use tasks
  - Reasons through thoughts before taking actions using reinforcement learning
  - Reports strong benchmark results including 42.5 on OSWorld and 64.2 on Android World
  - Released as open weights under Apache-2.0
limitations:
  - Released 7B model focuses on general computer use and is not specifically optimized for games
  - UI-TARS-1.5-7B trails the unreleased UI-TARS-1.5 on some benchmarks such as OSWorld (27.5 vs 42.5)
  - Top-performing UI-TARS-1.5 is available only through early research access by contacting ByteDance
