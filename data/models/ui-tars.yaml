description: UI-TARS-1.5-7B is an open-source 8.3B-parameter multimodal vision-language agent from ByteDance for GUI interaction that reasons before acting across computer browser and phone tasks. It uses reinforcement learning to improve inference-time scaling and decision-making. The model card reports state-of-the-art results on several GUI and grounding benchmarks.
