strengths:
  - Reconstructs instance-level 4D mesh scenes from a single monocular video or image
  - Exports full-scene animated GLB plus rendered comparison videos
  - Supports resident serving to load heavy models once for batch runs
limitations:
  - Non-commercial research use only due bundled third-party components
  - Requires Linux NVIDIA GPU with about 40GB VRAM and about 120GB disk
  - Runtime is about 19-22 minutes per video end-to-end
