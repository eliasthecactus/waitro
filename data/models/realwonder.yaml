summary: RealWonder is a real-time action-conditioned video generation system that combines single-image 3D reconstruction physics simulation and a distilled 4-step diffusion video generator to produce…
description: RealWonder translates continuous 3D actions through physics simulation into optical flow and RGB visual representations that a distilled video generator can process. It integrates single-image 3D reconstruction physics simulation and a 4-step diffusion video generator. The project reports 13.2 FPS at 480x832 resolution and interactive exploration of forces robot actions and camera controls on rigid objects deformable bodies fluids and granular materials. The released code depends on SAM 3D Objects SAM 2 Genesis and downloaded checkpoints. The demo is tested on an NVIDIA H200 GPU with CUDA 12.1.
