summary: VibeVoice-Realtime-0.5B is a lightweight 0.5B-parameter real-time text-to-speech model from Microsoft with streaming text input and long-form speech generation.
description: A real-time text-to-speech model built for streaming text input and long-form speech generation. It combines a Qwen2.5-0.5B language model with an acoustic tokenizer and a diffusion-based decoding head. The variant supports a single speaker and is primarily intended for English speech synthesis.
