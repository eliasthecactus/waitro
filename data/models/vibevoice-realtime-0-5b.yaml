strengths:
  - Real-time TTS with approximately 300 ms first audible latency depending on hardware
  - Supports streaming text input
  - Supports long-form speech generation up to about 10 minutes
limitations:
  - Primarily English-only; other languages may produce unpredictable results
  - Supports only a single speaker in this variant
  - Research-only use; not intended for commercial or real-world deployment without further testing
