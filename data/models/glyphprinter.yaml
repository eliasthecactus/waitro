id: glyphprinter
name: GlyphPrinter
org: unknown
released: 2026-03-09
dateSource: github
summary: GlyphPrinter is a preference-based text-to-image rendering framework built on FLUX.1-dev that uses region-grouped DPO to improve glyph accuracy in multilingual and Chinese text.
description: GlyphPrinter is a text rendering framework for visual text generation that targets stroke distortions and incorrect glyphs in text-to-image models. It introduces the GlyphCorrector dataset with region-level glyph preference annotations and R-GDPO which optimizes preferences over local glyph regions. The card states that inference code model weights training code and the dataset were released and that the work was selected as a CVPR 2026 Highlight.
