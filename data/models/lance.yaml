summary: Lance is a 3.6B-parameter omni model outlined as reasoning-first and available on API with multimodal input and output.
description: The card frames Lance as an omni model, with capabilities extending over text generation, reasoning, audio, vision, image and video generation. It has 3.6B active parameters and supports 262k context length and 200 languages. It is a reasoning-first model with thinking traces that it uses to solve hard problems and is available on API.
