strengths:
  - Supports text image and video inputs with up to 1M token context
  - Offers configurable reasoning levels and native MTP speculative decoding
  - Full BF16 weights are suitable for customization and domain adaptation
limitations:
  - BF16 deployment requires 4x H100 or 2x GB200 GPUs
  - The BF16 release is a full-precision reference rather than an optimized deployment path
  - No CPU or Apple Silicon deployment path is listed
