description: NVIDIA Nemotron 3.5 Super VL is a 120B total / 12B active vision-language model for reasoning coding tool use document understanding and video understanding. It has BF16 full-precision reference weights and supports customization domain adaptation and full-precision evaluation. It uses a Mamba-2–Transformer hybrid Mixture-of-Experts architecture with a C-RADIO vision encoder and a vision-language connector. It supports up to 1M tokens of context and configurable reasoning modes through the chat template.
