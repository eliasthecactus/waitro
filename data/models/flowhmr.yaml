strengths:
  - Generates diverse motion candidates from monocular video using flow matching
  - Post-training rewards favor video fidelity and physical trackability
  - Per the authors achieves an 82.47% physical tracking success rate compared with 62.82% for GVHMR
limitations:
  - Model weights are licensed for non-commercial use only
  - Reported physical tracking success is 82.47% so tracking failures remain possible
