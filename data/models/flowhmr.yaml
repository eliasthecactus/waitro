id: flowhmr
name: FlowHMR
org: FlowHMR
released: 2026-09-30
dateSource: huggingface
summary: FlowHMR is a flow-matching model for recovering physically plausible global 3D human motion from monocular video.
description: FlowHMR formulates monocular video motion capture as video-conditioned motion generation and pretrains a flow matching model for this task. It post-trains with GRPO using fidelity and tracking rewards so outputs stay faithful to the input video while being more physically trackable. Per the authors it introduces Wild-4K and reports an 82.47% physical tracking success rate versus 62.82% for GVHMR.
