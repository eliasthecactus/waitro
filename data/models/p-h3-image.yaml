id: p-h3-image
name: P-H3 Image
org: Pruna AI
released: 2026-10-28
dateSource: huggingface
summary: P-H3-Image is a diffusion image model built on MiniMax-H3 that renders 8-megapixel images in 8 steps without CFG and edits images using up to 8 inputs — shipped as ComfyUI files in bf16/int8/w4a8…
description: P-H3-Image is released by Pruna AI as ComfyUI files for text-to-image generation and image editing on top of MiniMax-H3. Every component comes in bf16 plus ComfyUI's native int8 (int8_convrot) and w4a8 formats and precisions can be mixed freely; the smallest set is a 20 GB download that peaks at about 21 GB of VRAM at 8 MP while the bf16 set is a 55 GB download peaking near 56 GB. Quantized files need no calibration data and run on comfy-kitchen INT8 kernels for NVIDIA Ampere or newer and AMD RDNA3/4. A Qwen3.5-9B-based prompt upsampler turns short requests into full prompts. Workflows cover text-to-image at 8 MP and edits with one image plus up to 7 references; a 2 GB LoRA also runs P-H3-Image on an existing MiniMax-H3 FL2VA transformer in ComfyUI.
