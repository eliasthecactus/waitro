strengths:
  - Renders 8-megapixel images in 8 steps with no CFG or negative prompt
  - Edits with up to 8 input images — one image to edit plus up to 7 references
  - Quantized w4a8 plus int8 VAE set fits in about 21 GB of VRAM from a 20 GB download
  - On a 48 GB L40S the w4a8 set renders a 2048 x 2048 image in 6.3 s instead of 19 s
limitations:
  - Sensitive to prompting — the Qwen3.5-9B prompt upsampler should stay in the graph
  - Hands can break and small background people can come out distorted
  - Licence excludes the EU UK South Korea and the USA
