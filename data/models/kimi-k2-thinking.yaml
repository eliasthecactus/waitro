summary: Kimi K2 Thinking is a 1T-parameter MoE reasoning model from Moonshot AI that interleaves chain-of-thought with tool calls across long agentic workflows and ships with native INT4 quantization and a…
description: Built on Kimi K2 as a thinking agent, the model is end-to-end trained to alternate reasoning steps with function calls, maintaining goal-directed behaviour across up to 200-300 consecutive tool invocations. It is a Mixture-of-Experts architecture with 1T total and 32B activated parameters, 61 layers, 384 experts with 8 selected per token, MLA attention and SwiGLU activations. Quantization-Aware Training in the post-training stage applies INT4 weight-only quantization to the MoE components for roughly 2x lower latency and GPU memory in low-latency mode. The card reports leading scores on HLE with tools BrowseComp and agentic-search and coding benchmarks including SWE-bench Verified and Terminal-Bench. Weights are released under a Modified MIT licence.
