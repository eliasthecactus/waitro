strengths:
  - Specialized for long-horizon co-work workflows that chain search code tools and files
  - Mixture-of-Experts with 35B total and 3B activated parameters plus a 262144-token base context
  - Apache-2.0 weights shipped as BF16 GGUF FP8 NVFP4 and MLX checkpoints
limitations:
  - MLX builds are text only and Mac Metal acceptance is still pending
  - Retrieval-heavy and simulated-user tasks still have headroom
  - Native browser or desktop visual interaction is not part of the co-work training interface
