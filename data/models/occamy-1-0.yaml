summary: Occamy 1.0 is a 35B-total / 3B-active Mixture-of-Experts model with a vision encoder post-trained from Qwen3.6-35B-A3B for long-horizon co-work agents that coordinate search, code, tools, files and…
description: "Occamy-1.0 is an agentic model built for real-world co-work: long-horizon stateful tasks that require coordinated use of search, code, tools, files, structured APIs and productivity software. It starts from the post-trained Qwen3.6-35B-A3B checkpoint and keeps that architecture (40 layers, 256 experts, 8 routed + 1 shared, 262,144-token base context) while adding further training via full-parameter SFT, HDPO, a uniform merge of a Marathon and a Sprint expert, and a final SAO stage. Released weights include BF16, GGUF, APEX GGUF, FP8, NVFP4 and an MLX collection (text only, Mac Metal acceptance pending), plus an experimental MTP draft head. The training stack is released as Dressage."
