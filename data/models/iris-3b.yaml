id: iris-3b
name: Iris 3B
org: Sperid Labs
released: 2026-10-05
dateSource: huggingface
summary: Iris 3B is a 3-billion-parameter pixel-space text-to-image model that generates 1024-pixel images directly without a VAE or latent space and ships fine-tuned variants for monocular depth estimation…
description: Iris 3B is a 3-billion-parameter pixel-space generative model for text-to-image generation. It produces 1024-pixel images directly without a VAE or latent space. The same backbone is fine-tuned for monocular depth estimation and image restoration/upscaling. A 4-step distilled Turbo variant is included in the repository.
tasks:
  - image-generation
  - depth-estimation
  - image-upscaling
architecture: other
access: open-weights
license:
  id: Apache-2.0
  commercial: yes
  note: Apache-2.0 license permits commercial use
io:
  in:
    - text
    - image
  out:
    - image
    - depth
params:
  total: 2.99
hardware:
  platforms:
    - cuda
  note: Requires an NVIDIA GPU with CUDA. Text encoder Qwen3-VL-4B-Instruct downloads automatically on first run.
links:
  weights: https://huggingface.co/speridlabs/iris-3b
  homepage: https://speridlabs.com/research/iris
strengths:
  - Generates 1024-pixel images directly in pixel space without a VAE or latent compression
  - Ships fine-tuned depth estimation and image upscaling variants from the same backbone
  - Reports GenEval 0.798 and DPG-Bench 86.52 for the base model
limitations:
  - Requires an NVIDIA GPU with CUDA and downloads a separate Qwen3-VL-4B-Instruct text encoder
  - Text-to-image weights are about 12 GB while depth and upscaler folders add about 12 GB each
  - Turbo variant is less reliable on dense or long rendered text and gives less variety across seeds
notes: Drafted from the model card; date, licence and size taken from Hugging Face/GitHub metadata.
