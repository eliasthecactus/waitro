id: omnishotcut
name: OmniShotCut
org: Unknown
released: 2026-04-24
dateSource: github
summary: OmniShotCut is a 52.8M-parameter Shot-Query Transformer for shot boundary detection that finds clean cuts and gradual transitions across diverse video sources.
description: Per the authors OmniShotCut is a state-of-the-art shot boundary detector for anime vlogs games shorts sports and screen recordings. It uses a Shot-Query-based Video Transformer to recognize sudden jumps and transitions such as dissolves fades and wipes. The v1.5 checkpoint has 52.8M parameters and is described as reducing false cuts on continuous camera motion and lighting changes while improving dense fast-cut recall.
