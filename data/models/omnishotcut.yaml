hardware:
  platforms:
    - cuda
  note: Requires PyTorch with CUDA support and ffmpeg on PATH for video decoding.
links:
  repo: https://github.com/UVA-Computer-Vision-Lab/OmniShotCut
  homepage: https://uva-computer-vision-lab.github.io/OmniShotCut_website/
strengths:
  - Handles diverse video sources including anime vlogs games sports and screen recordings
  - Recognizes both sudden jumps and gradual transitions such as dissolves fades and wipes
  - v1.5 reduces false cuts on continuous camera motion and lighting changes
limitations:
  - Training code and benchmark are not yet released
  - Requires ffmpeg and a PyTorch CUDA setup for inference
