summary: VerseCrafter is a 17.34B-parameter controllable video world model built on a frozen Wan2.1-T2V-14B diffusion backbone with a GeoAdapter that injects 4D geometric control over camera and multi-object…
description: VerseCrafter is a controllable video world model that generates realistic dynamic video from a frozen Wan2.1-T2V-14B diffusion backbone plus a trainable geometry-aware GeoAdapter driven by explicit 4D control signals.
