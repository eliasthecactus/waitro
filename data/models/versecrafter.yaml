  homepage: https://sixiaozheng.github.io/VerseCrafter_page/
strengths:
  - Unified 4D control state gives interpretable control over camera motion and multi-object motion jointly
  - Frozen Wan2.1 backbone with GeoAdapter injects 4D controls into diffusion blocks without sacrificing video quality
  - Generates 720x1280 videos of 81 frames with strong spatial-temporal coherence
limitations:
  - Licensed for academic and research use only with commercial use not permitted
  - Explicitly not intended for use within the European Union
  - Full pipeline requires depth estimation segmentation and 3D Gaussian fitting before generation
