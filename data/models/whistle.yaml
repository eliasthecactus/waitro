id: whistle
name: Whistle
org: Cactus Compute
released: 2026-09-30
dateSource: huggingface
summary: Whistle is a compact 16.9 MB speech model for transcription with word timestamps and speech embeddings in seven languages.
description: Whistle is a speech model distributed as `whistle.cact` and `checkpoints/whistle.safetensors`. It supports transcription with word-level timestamps and speech embeddings in seven languages. Inference is available through the `cactus-compute` Python package which caches the engine and weights on first use. Audio input should be 16 kHz WAV unless the optional `cactus-compute[mic]` extra is installed for other sample rates or microphone capture.
tasks:
