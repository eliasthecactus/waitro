  commercial: yes
io:
  in:
    - audio
  out:
    - text
    - embedding
hardware:
  platforms:
    - cuda
  note: No explicit hardware requirements are listed on the card; runtime binaries and supported platforms are documented in the Cactus repository.
links:
  weights: https://huggingface.co/Cactus-Compute/whistle
  homepage: https://cactuscompute.com/blog/whistle
strengths:
  - Small footprint at 16.9 MB
  - Produces word timestamps and speech embeddings in addition to transcription
  - Supports seven languages
limitations:
  - Limited to seven languages
  - Expects 16 kHz WAV input unless the optional mic extra is installed
