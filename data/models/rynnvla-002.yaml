summary: RynnVLA-002 is an autoregressive vision-language-action and world model that unifies action understanding with image generation and reports 97.4% success on LIBERO.
description: RynnVLA-002 is an autoregressive action world model from Alibaba DAMO Academy that integrates a Vision-Language-Action model and a world model in one framework. It adds a continuous Action Transformer plus wrist-camera input and generation and state input. It reports 97.4% success on the LIBERO benchmark and provides VLA and world-model checkpoints on Hugging Face.
