id: devstral-2
name: Devstral 2
org: Mistral
released: 2025-05-12
dateSource: huggingface
summary: A 24B-parameter text-only agentic LLM for software engineering fine-tuned from Mistral-Small-3.1 with a 128k context window.
description: Devstral is an agentic LLM for software engineering built by Mistral AI and All Hands AI. It is fine-tuned from Mistral-Small-3.1 and is text-only with the vision encoder removed. It is designed to use tools to explore codebases and edit multiple files. The card lists it as achieving 46.8% on SWE-bench Verified with the OpenHands scaffold.
