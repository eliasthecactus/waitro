    - cpu
  note: The card states it is light enough to run on a single RTX 4090 or a Mac with 32GB RAM; local deployment options listed include vLLM, mistral-inference, transformers, LM Studio, llama.cpp and Ollama.
links:
  weights: https://huggingface.co/mistralai/Devstral-Small-2505
strengths:
  - Strong agentic coding performance on SWE-bench Verified reported with the OpenHands scaffold
  - Apache 2.0 licence permits commercial and non-commercial use and modification
  - 128k context window supports long codebase exploration
limitations:
  - Text-only model because the vision encoder was removed
  - Recommended usage is with the OpenHands scaffold
  - SWE-bench scores are scaffold-dependent and not directly comparable across different scaffolds
