  total: 10.17
contextTokens: 128000
hardware:
  platforms:
    - cuda
  note: Requires at least 24 GB VRAM for bf16 inference.
links:
  weights: https://huggingface.co/stepfun-ai/Step3-VL-10B
  homepage: https://stepfun-ai.github.io/Step3-VL-10B/
strengths:
  - Supports Sequential Reasoning and Parallel Coordinated Reasoning modes for scaled test-time compute
  - Apache-2.0 licensed with FP8 weights and vLLM support available
limitations:
  - Requires at least 24 GB VRAM for deployment
  - PaCoRe mode synthesizes 16 rollouts with up to 128K context so it is more compute-intensive than standard SeRe
