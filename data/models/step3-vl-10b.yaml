id: step3-vl-10b
name: Step3-VL-10B
org: StepFun
released: 2026-01-13
dateSource: huggingface
summary: Step3-VL-10B is a 10.17B-parameter open-weights image-text-to-text model pairing a 1.8B perception encoder with a Qwen3-8B decoder for visual perception STEM reasoning OCR and GUI grounding.
description: Step3-VL-10B is a 10.17B-parameter open-weights image-text-to-text model. It combines a 1.8B PE-lang perception encoder with a Qwen3-8B decoder and was trained on a 1.2T-token multimodal corpus with SFT and RL. The card highlights visual perception STEM reasoning OCR/document understanding GUI grounding spatial understanding and visual code tasks. It supports Sequential Reasoning (SeRe) and Parallel Coordinated Reasoning (PaCoRe) inference modes.
tasks:
  - image-understanding
  - reasoning
  - ocr
architecture: transformer
