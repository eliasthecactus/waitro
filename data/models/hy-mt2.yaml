summary: HY-MT2 is a family of fast-thinking multilingual translation models from Tencent — 1.8B, 7B and a 30B-A3B MoE — that translates among 33 languages and follows translation instructions in multiple…
description: HY-MT2 translates among 33 languages and is built to follow multi-lingual translation instructions rather than plain sentence translation. The family spans 1.8B, 7B and 30B-A3B (MoE) sizes, with FP8 and GGUF variants published for the smaller models. AngelSlim 1.25-bit quantization brings the 1.8B model down to 440 MB of storage and 1.5x faster inference for on-device deployment. Prompt templates in the card cover default translation, terminology constraints, style control, personalization, delimiter preservation and structured-data translation that keeps keys and placeholders intact. Inference is documented for transformers, vLLM and SGLang, and full-parameter and LoRA fine-tuning are supported through DeepSpeed ZeRO configurations and LLaMA-Factory.
