  weights: https://huggingface.co/microsoft/VibeVoice-ASR
strengths:
  - Processes up to 60 minutes of continuous audio in a single pass
  - Joint ASR with diarization and timestamps in structured output
  - Customized hotwords for domain-specific vocabulary
  - Supports 50+ languages with code-switching and no explicit language setting
limitations:
  - Runs on CUDA GPUs; no CPU Mac GGUF or ONNX path is documented
  - Evaluation numbers are deferred to the external technical report
  - Speech-to-text only; no translation between languages is stated
