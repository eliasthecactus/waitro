dateSource: huggingface
summary: VibeVoice-ASR is an ~8.7B-parameter unified speech-to-text model that transcribes up to 60 minutes of audio in a single pass and outputs structured who/when/what transcriptions with speaker…
description: VibeVoice-ASR handles long-form audio of up to 60 minutes in one pass within a 64K token context rather than chunking it. It jointly performs ASR, speaker diarization and timestamping to produce structured transcriptions indicating who said what and when. Users can supply customized hotwords for domain-specific names and technical terms. It supports over 50 languages without explicit language settings and handles code-switching within and across utterances.
