strengths:
  - Built for agentic workflows tool use and high-volume workloads such as IT ticket automation
  - Supports up to 1M tokens of context with configurable thinking mode on or off
  - Includes built-in MTP layers enabling native speculative decoding for faster generation
limitations:
  - Requires a minimum of 8x H100-80GB GPUs to run
  - Supported languages are English French German Italian Japanese Spanish and Chinese only
  - Reasoning mode is controlled via the chat template flag and must be configured explicitly
