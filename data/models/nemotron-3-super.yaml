summary: Nemotron 3 Super is a 120B-parameter (12B active) Mamba-2/MoE/attention hybrid language model from NVIDIA built for agentic workflows and long-context reasoning with a configurable reasoning mode.
description: Nemotron 3 Super is a 120B-parameter (12B active) hybrid LatentMoE LLM from NVIDIA combining interleaved Mamba-2 and MoE layers with select attention layers and Multi-Token Prediction heads. It is designed for agentic workflows reasoning tool use and long-context work with a configurable reasoning mode.
