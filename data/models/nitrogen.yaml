strengths:
  - Trained on 40 ·000 hours of gameplay across over 1 ·000 games
  - Maps 256x256 RGB frames directly to 21x16 gamepad actions
  - Works best on gamepad-controlled action platformer and racing games
limitations:
  - Less effective on mouse-and-keyboard games such as RTS and MOBA
  - Non-commercial research-only license restricts commercial deployment
  - Current inference tooling supports Windows games only
