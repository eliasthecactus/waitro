id: nitrogen
name: Nitrogen
org: NVIDIA
released: 2025-12-18
dateSource: huggingface
summary: NitroGen is a 493M-parameter vision-to-action foundation model that plays video games directly from raw 256x256 RGB frames by outputting gamepad actions.
description: NitroGen is a unified vision-to-action foundation model designed to play video games directly from raw frames. It is trained via large-scale behavior cloning on 40,000 hours of gameplay across over 1,000 games, mapping RGB video footage to gamepad actions. Its architecture combines a SigLip2 Vision Transformer with a Diffusion Matching Transformer (DiT). The model performs best on games designed for gamepad controls (action, platformer, racing) and is less effective on games that rely heavily on mouse and keyboard (RTS, MOBA). Inference currently supports Windows games.
