summary: DeepGen 1.0 is a 5B-parameter unified multimodal model combining a 3B VLM and 2B DiT for image generation editing reasoning-based generation and text rendering.
description: DeepGen 1.0 is a lightweight unified multimodal model with only 5B parameters. It integrates general image generation, general image editing, reasoning image generation, reasoning image editing, and text rendering within a single model. The model uses a 3B VLM and a 2B DiT backbone connected by a Stacked Channel Bridging framework. Checkpoints are released as sharded ZIP files that must be merged before use.
