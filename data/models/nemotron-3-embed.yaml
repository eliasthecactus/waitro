id: nemotron-3-embed
name: Nemotron 3 Embed
org: NVIDIA
released: 2026-07-14
dateSource: huggingface
summary: Nemotron 3 Embed is a 1.14B-parameter transformer text embedding model from NVIDIA that produces 2048-dimensional multilingual dense vectors for retrieval and semantic similarity.
description: Nemotron-3-Embed-1B-BF16 is a transformer-based text embedding model trained by NVIDIA for retrieval and semantic similarity tasks. It was evaluated across 34 languages and is intended for multilingual RAG and semantic search workflows. The model outputs a 2048-dimensional dense embedding per input text and supports dynamic embedding sizes by slicing and re-normalizing the vector.
tasks:
  - embeddings
architecture: transformer
