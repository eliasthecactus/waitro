  commercial: yes
io:
  in:
    - text
  out:
    - embedding
params:
  total: 1.14
hardware:
  platforms:
    - cuda
  note: The model is optimized for NVIDIA GPU-accelerated systems and the card provides CUDA-enabled PyTorch setup instructions.
links:
  weights: https://huggingface.co/nvidia/Nemotron-3-Embed-1B-BF16
strengths:
  - Multilingual retrieval model evaluated across 34 languages
  - Produces 2048-dimensional dense embeddings for retrieval and semantic search
  - Supports slicing to smaller embedding sizes with L2 re-normalization
limitations:
  - Max sequence length is 32768 tokens so longer inputs need chunking or truncation
  - BF16 checkpoints require Transformers 5.2.0 or above and CUDA-enabled PyTorch
  - "Retrieval use requires query: and passage: prefixes"
