summary: SymphonyGen is a 3D hierarchical transformer framework (87M harmony-skeleton model plus a 124M two-stream symphony model) that generates orchestral scores conditioned on a beat-quantized multi-voice…
description: "SymphonyGen decomposes symphonic scores along Bar, Track and Event axes with a cascading decoder architecture and conditions generation on a beat-quantized multi-voice harmony skeleton, so a few user-written chords can drive orchestration or an existing MIDI can be re-orchestrated via harmony analysis. Four packed checkpoints are released: a 1D harmony skeleton model (12 layers, hidden 768, 87M), a 3D symphony model pretrained on the SymphonyNet Dataset (33 layers, hidden 512, 124M, 2-stream cross-attention) and two GRPO-reinforced variants using a CLaMP 3 audio-embedding reward with or without a track-density term. Inference supports dissonance-averse sampling with recommended (λ_hn, λ_nn) = (1, 10) and optional register decay. Pretraining used four NVIDIA H800 GPUs for one day; generation is run through the codebase with the packed .pt checkpoints."
