strengths:
  - Controllable generation through a user-writable harmony skeleton or by analyzing an existing MIDI
  - Two GRPO-reinforced checkpoints tuned with a CLaMP 3 audio-perceptual reward
  - Dissonance-averse sampling with published recommended settings
  - Trained on the SymphonyNet Dataset of 728 classical and 45 632 contemporary MIDI files
limitations:
  - Intended as a collaborative aid for composers rather than an autonomous replacement
  - Oriented toward contemporary cinematic scoring through its data reward and hyperparameters
  - Outputs may inadvertently resemble existing works and require originality verification
  - Reproduced objective metrics can differ from the paper's tables due to harmony-analysis implementation details
