    - image
params:
  total: 20.43
hardware:
  platforms:
    - cuda
links:
  weights: https://huggingface.co/Qwen/Qwen-Image-Layered
strengths:
  - Produces layered RGBA decompositions for inherent editability
  - Supports variable layer counts (e.g. 3 or 8) and recursive decomposition
  - Layer isolation enables resizing repositioning recoloring and object removal without affecting other content
limitations:
  - Requires transformers>=4.51.3 and a diffusers install from source
  - Resolution bucket 640 is the recommended setting for this version
  - Pipeline is run on CUDA in bfloat16
