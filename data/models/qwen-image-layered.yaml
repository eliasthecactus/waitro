id: qwen-image-layered
name: Qwen-Image-Layered
org: Alibaba Qwen
released: 2025-12-17
dateSource: huggingface
summary: Qwen-Image-Layered is a ~20.4B-parameter diffusion model that decomposes an image into multiple RGBA layers for independent high-fidelity editing.
description: Qwen-Image-Layered is a ~20.4B-parameter diffusion model from Alibaba Qwen that decomposes a single image into multiple RGBA layers so each layer can be edited independently while the rest of the image stays untouched.
tasks:
  - image-editing
  - segmentation
architecture: diffusion
