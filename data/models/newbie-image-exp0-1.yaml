id: newbie-image-exp0-1
name: NewBie-image-Exp0.1
org: NewBieAi-lab
released: 2025-11-30
dateSource: huggingface
summary: A 3.5B parameter DiT text-to-image base model pretrained on anime data with Gemma3 and Jina CLIP text conditioning.
description: NewBie image Exp0.1 is a 3.5B parameter DiT text-to-image base model built on Next-DiT and developed from research on the Lumina architecture. It uses Gemma3-4B-it and Jina CLIP v2 as text encoders and the FLUX.1-dev 16-channel VAE. It is pretrained on high-quality anime data and supports natural language tags and XML-structured prompts.
tasks:
