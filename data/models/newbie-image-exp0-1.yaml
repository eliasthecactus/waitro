strengths:
  - Pretrained on high-quality anime data for detailed anime-style images
  - Uses Gemma3-4B-it and Jina CLIP v2 for prompt understanding and instruction adherence
  - XML-structured prompts reportedly improve attention binding and attribute disentanglement in multi-character scenes
