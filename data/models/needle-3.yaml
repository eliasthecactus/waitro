summary: Needle 3 is an on-device Cactus Compute model for tool calling structured extraction and text embeddings.
description: An on-device model designed for tool calling structured extraction and text embeddings. The repository provides needle3.cact and checkpoints/needle3.safetensors while runtime binaries and supported platforms are maintained in the Cactus repository. It is used through the cactus-compute Python package which downloads and caches the engine and weights on first use.
