id: splatanything
name: SplatAnything (InfiniSplat v3)
org: Zhejiang University and Tencent Hunyuan
released: 2026-11-08
dateSource: huggingface
summary: Feed-forward 3D Gaussian splatting from N images, with or without camera poses, across objects, rooms, streets and aerial views. Also does multi-camera rigs and panoramas.
description: A frozen geometry foundation model estimates multi-view geometry, which is moved into a Gaussian-spacing-normalized space before a Gaussian backbone and a light head predict per-pixel Gaussians. Normalizing by median Gaussian spacing instead of radial distance gives consistent scale targets across very different scenes. Supports Rig-Recon for driving rigs and Pano-Recon for 360° panoramas.
