id: bespoke-nimble-9b
name: Bespoke Nimble-9B
org: Unknown
released: 2026-09-18
dateSource: huggingface
summary: Bespoke Nimble-9B is a 9B-class LoRA adapter for Qwen3.5-9B that scores allowed answer tokens to fill context-grounded booleans, enum choices and rubric score levels with probabilities instead of…
description: A Qwen3.5-9B LoRA adapter (about 165 MiB) distributed with tokenizer, exact prompt builder, reference inference code and release metadata; the full base weights are not included and must be obtained separately. It scores candidate answer tokens directly, returning the selected value plus softmax probabilities and a probability-weighted expected score for rubric fields. Each field supports up to 255 choices and prompts beyond 8,192 tokens are rejected rather than truncated. Scoring uses softmax(candidate_logits / temperature) once with a default T=1.0 and no separate temperature fit for this checkpoint.
tasks:
