  id: Apache-2.0
  commercial: yes
io:
  in:
    - text
  out:
    - structured
contextTokens: 8192
hardware:
  platforms:
    - cuda
    - apple-silicon
  note: Requires the Qwen3.5-9B base checkpoint plus a CUDA GPU with BF16 support; the original run used PyTorch 2.8.0 with CUDA 12.8. Mac/MLX loaders are directed to the project quickstart.
links:
  weights: https://huggingface.co/bespokelabs/Bespoke-Nimble-9B
strengths:
  - Scores allowed answer tokens directly for booleans enum choices and rubric levels
  - Returns per-field probabilities and a probability-weighted expected score for integer rubrics
  - Supports up to 255 choices per field with an 8_192-token context limit
limitations:
  - Ships only the LoRA adapter so the Qwen3.5-9B base checkpoint is required
  - Does not generate reasoning or free-form answers
