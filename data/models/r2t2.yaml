summary: R2T2 是基于 Qwen3-ASR-1.7B 适配的低延迟稳定前缀流式 ASR…
description: R2T2（Real Real-Time Transcription）是由网易有道 Confucius4 团队提出的低延迟、高准确率稳定前缀流式语音识别（ASR）模型。它基于 Qwen3-ASR-1.7B 适配，在 1500 小时中英文音频上采用最长稳定前缀（LSP）学习进行两阶段 SFT 与 GRPO 训练，仅更新语言解码器并冻结音频编码器与投影器。模型支持 80 ms 至 2 s 的可配置解码块，以单调输出模式永久提交转写文本而不回改，适用于实时字幕、同传、下游 NLP 与 LLM 智能体等场景；同一检查点同时支持离线全上下文转写与流式推理。
