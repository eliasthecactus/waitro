strengths:
  - 支持 80 ms 至 2 s 可配置解码块且无需重训练
  - 160 ms + 1 个暂定 token 下识别错误率 5.76%（基线 21.01%）
  - 同一检查点兼顾流式与离线全上下文转写
limitations:
  - 训练仅使用中英文音频（跨语种迁移在 10 种额外语言的 18 个测试集上评估）
  - 160 ms 流式设置下 5.76% 的错误率仍略高于全上下文参考 5.15%
  - 许可证为网易自定义协议且文本缺失，商业使用范围未知
