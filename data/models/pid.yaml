id: pid
name: PiD
org: NVIDIA
released: 2026-04-28
dateSource: huggingface
summary: PiD is a Pixel Diffusion Decoder by NVIDIA that reformulates latent-to-pixel decoding as a conditional pixel-space diffusion model to produce super-resolved images in a single pass.
description: PiD acts as a latent-to-pixel decoder that denoises directly in high-resolution pixel space unifying decoding and upsampling into one generative module. The checkpoints are designed to work across several major Latent Diffusion Models such as FLUX SD3 SDXL Qwen-Image and DINOv2 via specific VAE weights.
