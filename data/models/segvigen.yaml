id: segvigen
name: SegviGen
org: Unknown
released: 2026-03-17
dateSource: github
summary: SegviGen is a framework for 3D part segmentation that repurposes large-scale 3D generative models to predict part-indicative colors while reconstructing geometry.
description: SegviGen unifies interactive part segmentation full segmentation and 2D segmentation-map-guided full segmentation in one architecture. The authors state it requires only 0.32% training data by reusing 3D generative priors. They report a 40% IoU@1 gain for single-click interaction and a 15% overall IoU improvement for unguided full segmentation versus P3-SAM.
tasks:
  - segmentation
architecture: other
access: open-weights
