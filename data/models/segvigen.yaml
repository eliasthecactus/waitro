  id: MIT
  commercial: yes
  note: MIT for SegviGen; bundled trellis2 code remains subject to TRELLIS.2 original license terms.
io:
  in:
    - 3d
    - image
    - mask
    - structured
  out:
    - 3d
hardware:
  platforms:
    - cuda
  note: Requires Linux and an NVIDIA GPU with at least 24GB memory.
links:
  repo: https://github.com/Nelipot-Lee/SegviGen
  homepage: https://fenghora.github.io/SegviGen-Page/
strengths:
  - Requires only 0.32% training data per the authors
  - Unifies interactive full and 2D-guided segmentation in one architecture
  - Reports 40% IoU@1 gain for single-click interaction and 15% overall IoU gain for unguided full segmentation versus P3-SAM
limitations:
  - Requires a Linux system with an NVIDIA GPU of at least 24GB memory
  - Inherits TRELLIS.2 code under its original license terms
