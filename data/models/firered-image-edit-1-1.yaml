strengths:
  - Supports multi-image conditioning and fusion of 10+ elements with agent-powered cropping and stitching
  - Ships an open LoRA training ecosystem plus distillation quantization and static-compilation acceleration
limitations:
  - Reported 4.5s generation speed assumes a 30GB VRAM class GPU
  - Benchmark claims are self-reported on Imgedit Gedit and RedEdit rather than independently reproduced
  - Targets image editing only and is not positioned as a general text or video model
