summary: FireRed-Image-Edit-1.1 is a 20.4B-parameter open-weights image-to-image editing foundation model focused on identity-consistent portrait editing multi-image fusion and text-style-preserving edits.
description: FireRed-Image-Edit-1.1 is an upgrade to FireRedTeam's general-purpose image editing foundation model. Compared with version 1.0 it targets stronger identity consistency, multi-image conditioning and domain-specialised editing such as portrait makeup and text style reference, alongside photo restoration. The release includes an open LoRA training ecosystem, a speed-up suite (distillation, quantization, static compilation) reporting 4.5s end-to-end generation within 30GB VRAM, ComfyUI node support and a GGUF lightweight format. The card reports state-of-the-art open-source results on Imgedit, Gedit and RedEdit plus human evaluations favouring prompt following and visual consistency.
