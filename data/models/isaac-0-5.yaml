strengths:
  - One shared sparse backbone co-trained for video understanding spatial grounding task-progress estimation and robot action
  - Trained on more than 35 robot systems and 100000 hours of robot experience plus one million hours of general video
  - Offers continuous control through a dedicated Flow expert and 36-block diffusion transformer plus discrete control via a 2048-token FAST action vocabulary
limitations:
  - Consumed only through the Perceptron Isaac repository at a pinned commit; direct Transformers and stock LeRobot usage are not currently supported
  - A 36B-parameter model that takes images video language robot state and action history as input
  - Closed-loop control works by predicting the next action chunk while the current chunk is still executing
