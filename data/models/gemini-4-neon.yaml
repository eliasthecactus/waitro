summary: Google's frontier Gemini 4 model for software engineering, knowledge work and science, between Carbon and Hydrogen. Cheaper per task than Carbon.
description: Sits between Gemini 4 Carbon (hardest long-horizon work) and Gemini 4 Hydrogen (fast everyday work). Four thinking levels, default high. Google reports the lowest fabrication rate in its internal Antigravity tests and 32% lower cost per task than Carbon at high thinking. Available in the paid Gemini API tier, Gemini for business, Antigravity and the Gemini app (Pro and Ultra). API id gemini-4-neon.
