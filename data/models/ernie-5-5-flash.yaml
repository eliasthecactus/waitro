summary: ERNIE 5.5 Flash is a 280B-parameter sparse Mixture-of-Experts text base model from Baidu with 14B activated parameters per token and up to 1M-token context for fine-tuning and inference.
description: ERNIE 5.5 Flash is a 280B-parameter sparse Mixture-of-Experts text base model from Baidu with 14B activated parameters per token and up to 1M-token context for fine-tuning and inference. It is a text-only MoE base model. Released as a pre-training checkpoint (FP8 and BF16 safetensors). Total parameters include the input embedding and output head; ECHO parameters (0.36B) are excluded. Weights are openly downloadable on Hugging Face and ModelScope. The custom license defines revenue-based terms for related products.
