strengths:
  - 280B total parameters with only 14B activated per token
  - Fine-tuning and inference support a 1M-token context
  - Pre-trained on 33.5T tokens with repository-scale code and long-context data
  - Both FP8 and BF16 weights are released
limitations:
  - Released as a pre-training checkpoint before any mid- or post-training
  - Custom Baidu licence defines revenue-based terms for related products and services
  - Text-only modality
  - Requires about 280B total parameters of storage and memory despite 14B activation
