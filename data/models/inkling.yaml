strengths:
  - Open weights under Apache-2.0 for fine-tuning and integration
  - Native text image and audio inputs with text output
  - Sparse MoE with 12B active parameters out of 276B total
limitations:
  - Audio input is WAV 16kHz and ideally under 2 minutes
  - Image dimensions should be 40px to 4096px for optimal performance
  - Residual safety risk noted for role-play and indirectly framed harmful prompts
