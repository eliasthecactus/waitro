  commercial: yes
  note: Apache-2.0 with upstream Qwen3.6 attribution preserved
io:
  in:
    - text
  out:
    - text
params:
  total: 34.66
  active: 3
contextTokens: 131072
hardware:
  platforms:
    - cuda
  note: BF16 weights need roughly 69 GB of GPU memory plus inference state
links:
  weights: https://huggingface.co/Diffuspace/Clover-35B-A3B-Preview
  homepage: https://diffuspace.ai/blog/clover-35b/
strengths:
  - Block diffusion decoding with LowConfidence parallel resolution
  - 128K context covers long prompts and long responses
  - Only about 3B active parameters per token from a 34.66B-parameter MoE backbone
limitations:
  - BF16 weights require roughly 69 GB of GPU memory
  - Very long generations can become repetitive
  - The Hugging Face PyTorch path may differ numerically from the recommended SGLang kernels
