summary: Boogu-Image-0.1-Edit is a 10B-parameter Apache-2.0 image-to-image editing model with bilingual Chinese-English text rendering and editing capabilities.
description: The card describes Boogu-Image-0.1-Edit as part of a unified Apache-2.0 image generation and editing model family released with checkpoints and inference code. Per the authors it handles edits such as object insertion replacement and removal attribute changes background replacement and Chinese-English text editing. It supports output resolutions up to 2K but the card notes results are more stable at 1K and only one reference image is supported for now.
