strengths:
  - High mathematical capability per parameter on competition-level benchmarks
  - Trained on less than 300B curated tokens with sequences up to 131k tokens
  - Apache-2.0 licensed weights and serving code
limitations:
  - Designed for single-turn math reasoning rather than general instruction following
  - Can lose the scope of a prompt and reinterpret it as a different mathematical task
  - Transformers path supports one model replica per process with no tensor or pipeline parallelism
