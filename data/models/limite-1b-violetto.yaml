summary: Limite 1B Violetto is a 1.04B-parameter dense autoregressive transformer trained from scratch on under 300B curated tokens for high-throughput competition-level mathematical reasoning with context…
description: Limite 1B Violetto is Paradigma's first model, a dense autoregressive transformer with an architecture inspired by community pre-training speedrun work. It was trained from scratch on a mixture of less than 300B highly curated tokens and handles sequences up to 131k tokens. Post-training combines synthetic data generation, curated SFT and RL to reach competition-level math results; the card reports an average of 74.25% on BeyondAIME. The model is intentionally lightly instruction-tuned for single-turn use with only the canonical system prompt and current user message, and it responds with reasoning patterns unlike a general assistant. Serving is supported through a Limite vLLM plugin or the Hugging Face Transformers APIs (custom architecture code requires trust_remote_code=True), validated on NVIDIA H100 with CUDA 13.0.
