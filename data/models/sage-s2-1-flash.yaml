id: sage-s2-1-flash
name: Sage S2.1 Flash
org: Shanghai AI Lab (InternLM)
summary: Open-weights 320B MoE (18B active) scientific multimodal model for research tasks that need many rounds of analysis, tools and verification.
description: Built on the GLM-5.3-Flash architecture. Combines scientific data understanding with retrieval, programming and tool use; molecular graphs, crystal structures and protein sequences and structures are read through the separate Sage SciPerception encoders. Also strong on office, spreadsheet and ML engineering tasks per the card.
