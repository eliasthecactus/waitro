summary: Anima v2 is a 2 billion parameter text-to-image model created by circlestone-labs focusing primarily on anime concepts and artistic illustrations.
description: Anima is a text-to-image model created via a collaboration between CircleStone Labs and Comfy Org. It is focused mainly on anime concepts characters and styles, and is designed for making illustrations and artistic images. It comes in various versions including Anima-Base Anima-Aesthetic and Anima-Turbo.
