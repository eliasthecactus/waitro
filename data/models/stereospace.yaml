id: stereospace
name: StereoSpace
org: ETH Zurich PRS
released: 2025-11-23
dateSource: huggingface
summary: StereoSpace is a latent diffusion model fine-tuned from Stable Diffusion 2 that generates a baseline-controllable stereo view from a single input image.
description: StereoSpace is an end-to-end latent diffusion model for baseline-controllable single-image stereo view generation. It is derived from stabilityai/stable-diffusion-2 through fine-tuning as described in the StereoSpace paper. The model is intended to synthesize stereo geometry without depth estimation in a canonical space.
