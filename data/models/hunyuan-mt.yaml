  total: 8.03
hardware:
  platforms:
    - cuda
  note: Weights are distributed as a Hugging Face LLM that does not include CUDA or lower-precision kernels for CPU or Apple Silicon.
links:
  repo: https://github.com/Tencent-Hunyuan/Hy-MT
  weights: https://huggingface.co/tencent/Hunyuan-MT-7B
strengths:
  - Supports mutual translation among 33 languages including Tibetan Kazakh Mongolian Uyghur and Cantonese
  - Places first in 30 of 31 WMT25 language categories it competed in
  - Comes with a companion ensemble model Hunyuan-MT-Chimera plus fp8 quantized desktops
limitations:
  - Serves translation only; it is not a general chat assistant
  - Requires replacing ignored_layers in the config with ignore and upgrading compressed-tensors to 0.11.0 for fp8 variants
