id: hunyuan-mt
name: Hunyuan-MT
org: Tencent Hunyuan
released: 2025-08-28
dateSource: huggingface
summary: Hunyuan-MT-7B is a 7B-parameter transformer translation model from Tencent Hunyuan that translates between 33 languages and also ships with a companion ensemble variant.
description: A 7B-class (8.03B parameter) open-weights translation model from Tencent Hunyuan supporting mutual translation among 33 languages including five Chinese minority languages.
