description: IQuest Q1 is a Mixture-of-Experts (MoE) text model developed by IQuest for agentic coding reasoning and multi-step tool use. It has approximately 320B total parameters with an estimated 15B activated per token across 88 transformer layers 256 experts (8 activated) and a hybrid 3 SWA + 1 FA attention pattern with a 4096-token sliding window. It supports a 524288-token context and ships with MTP layers for speculative decoding. Deployment guidance covers SGLang and vLLM on CUDA using tensor parallelism plus tool-call and reasoning parsers. It is text-only with no multimodal capability.
