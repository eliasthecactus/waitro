strengths:
  - MoE design with roughly 320B total parameters and about 15B activated per token
  - Native 524288-token context for long agentic coding sessions
  - Tool-call and reasoning parsers plus an MTP draft model for SGLang and vLLM speculative decoding
limitations:
  - Text-only model with no multimodal capability
  - Production deployment needs multi-GPU tensor parallel serving (tp-size 8 in the example recipes)
  - Modified MIT licence requires visible IQuest-Q1 attribution for commercial products or services
