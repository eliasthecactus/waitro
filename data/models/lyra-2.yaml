id: lyra-2
name: Lyra 2
org: NVIDIA
released: 2026-04-06
dateSource: huggingface
summary: Lyra 2.0 is a 14B-parameter NVIDIA image-to-3D model that generates persistent, explorable 3D Gaussian scenes from a single 480x832 image using a WAN-14B-based video generator plus a 3D…
description: "The framework has two stages: it synthesizes a long-range video with strong global geometric consistency, then reconstructs the generated sequence into an explicit 3D representation. Per-frame 3D geometry is kept solely for information routing (retrieving relevant past frames and establishing dense correspondences with target viewpoints) while appearance comes from the generative prior, and the model is trained with self-augmented histories to correct temporal drift rather than propagate it. Input is a single image plus camera parameters (about 81 frames recommended); output is a set of 3D Gaussians with position, covariance, colour and opacity, written as a point cloud file such as .ply and rendered in real time."
