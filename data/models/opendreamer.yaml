id: opendreamer
name: OpenDreamer
org: Unknown
released: 2026-07-20
dateSource: github
summary: Open Dreamer is a JAX/Flax NNX implementation of the Dreamer 4 world-model pipeline — a causal video tokenizer plus an action-conditioned latent dynamics model — trained on Minecraft/VPT-style…
description: "The repository provides the training pipeline: training a causal video tokenizer, tokenizing Minecraft/VPT-style MP4 datasets into latent ArrayRecords, training an action-conditioned latent dynamics model, and generating rollouts with FVD scoring. A separate inference repository is pointed to for local rollouts from an MP4 plus a matching action sequence, and a hosted in-browser demo lets users play a generated Minecraft world with a Game ⟷ Dream toggle. The roadmap lists a full Dreamer 4 behaviour-cloning / RL agent training loop as not yet done."
