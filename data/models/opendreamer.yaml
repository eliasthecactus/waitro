  - Supports real-time interactive rollouts with a Game ⟷ Dream toggle in a hosted browser demo
  - Includes offline dataset tokenization and FVD-based quality evaluation tooling
limitations:
  - Licence is all rights reserved with only a temporary notice pending a future formal licence
  - Behaviour-cloning / RL agent training loop is still on the roadmap and not implemented
  - Training requires CUDA 12 JAX and prepared Minecraft/VPT-style ArrayRecord shards
