  homepage: https://mimo.xiaomi.com/blog/mimo-v2-flash
strengths:
  - Hybrid sliding-window and global attention cuts KV-cache storage by nearly 6x per the authors
  - Integrated MTP module enables self-speculative decoding that triples generation speed
  - Trained for agentic and coding work with large-scale RL including 100000+ verifiable code tasks
  - Supports a 256k context window with strong reported long-context retrieval
limitations:
  - 309B total parameters imply a large memory footprint despite only 15B being active
  - Aggressive 128-token sliding window relies on a learnable attention sink bias to hold long-context quality
