id: mimo-v2-flash
name: MiMo-V2-Flash
org: Xiaomi
released: 2025-12-16
dateSource: huggingface
summary: MiMo-V2-Flash is a 309B-parameter (15B active) Mixture-of-Experts language model from Xiaomi built for fast reasoning and agentic workflows with a 256k context window.
description: MiMo-V2-Flash is a Mixture-of-Experts language model with 309B total parameters and 15B active parameters, built on a hybrid attention architecture that interleaves sliding window attention with global attention at a 5:1 ratio. It adds an integrated Multi-Token Prediction module (0.33B parameters per block) that the authors report triples output speed during inference. Per the authors, post-training with Multi-Teacher On-Policy Distillation and large-scale agentic RL yields strong results on SWE-Bench Verified (73.4) and reasoning benchmarks, and the model is released under an MIT licence with base and MTP weights on HuggingFace.
