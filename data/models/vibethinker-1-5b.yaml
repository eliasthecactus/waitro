id: vibethinker-1-5b
name: VibeThinker 1.5B
org: transcript
released: 2025-11-04
dateSource: github
summary: VibeThinker-1.5B is a 1.5B-parameter dense reasoning model trained with the Spectrum-to-Signal Principle for competitive math and coding.
description: VibeThinker-1.5B is a dense model trained through Two-Stage Diversity-Exploring Distillation in SFT followed by MaxEnt-Guided Policy Optimization in RL.
tasks:
  - reasoning
  - coding
  - on-device-llm
