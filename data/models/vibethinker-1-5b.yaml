    - text
contextTokens: 40960
hardware:
  platforms:
    - cuda
  note: Recommended inference uses vLLM or SGLang.
links:
  repo: https://github.com/WeiboAI/VibeThinker
strengths:
  - 1.5B dense model reports higher AIME24 AIME25 and HMMT25 scores than DeepSeek R1-0120
  - Trained with a reported post-training cost of $7 800
  - Open weights released under MIT
limitations:
  - Recommended for competitive-style math and coding problems
  - Requires transformers>=4.54.0 or vLLM/SGLang for recommended inference
