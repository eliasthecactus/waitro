summary: HeyGen's talking-avatar video model. Makes a speaking video of a person from one photo plus a script or audio, natively at 2880x1620.
description: Generates a person speaking with their likeness, voice and gestures from a single photo, optionally with a short recording for identity. Supports motion prompts, two speakers in one frame, and word-level edits of existing talking video that leave other frames untouched. In the HeyGen app (free plan included, Turbo on Creator, Pro on Pro), the API and HeyGen MCP. Avatars from footage need a consent code and identity check.
