id: windowseat
name: WindowSeat
org: Huawei & Bayer Lab
released: 2025-11-28
dateSource: huggingface
summary: WindowSeat is an image-to-image latent diffusion model built by LoRA adaptation of Qwen-Image-Edit-2509 that removes reflections from a single photo in one step.
description: WindowSeat is a single-image reflection removal model released as a LoRA-adapted derivative of Qwen/Qwen-Image-Edit-2509. It performs end-to-end single-step latent diffusion reflection removal from one image and is implemented with PyTorch Transformers and PEFT.
