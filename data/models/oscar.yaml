architecture: diffusion
access: open-weights
license:
  id: Apache-2.0
  commercial: yes
io:
  in:
    - text
    - video
  out:
    - video
hardware:
  platforms:
    - cuda
  note: Distributed checkpoint shards (~4 GB).
links:
  weights: https://huggingface.co/zywu2115/OSCAR-2B
  homepage: https://wuzy2115.github.io/oscar-project-page/
strengths:
  - Action-conditioned world model fine-tuned for skeleton-conditioned robot video generation
  - Built on Cosmos-Predict2.5-2B and shipped as a public inference release
  - Apache-2.0 licensed for commercial use
limitations:
  - Specialized to robotics video generation rather than general-purpose video
  - Requires action/skeleton conditioning
  - Checkpoint is distributed across shards
notes: Drafted from the model card; date, licence and size taken from Hugging Face/GitHub metadata.
