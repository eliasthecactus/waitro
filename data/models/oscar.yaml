id: oscar
name: Oscar
org: Oscar authors
released: 2026-05-14
dateSource: huggingface
summary: Oscar is a 2B-parameter action-conditioned robotics world model fine-tuned from Cosmos-Predict2.5-2B that generates skeleton-conditioned robot videos.
description: Oscar is an omni-embodiment action-conditioned world model for robotics. This public inference release provides the OSCAR-2B checkpoint — a fine-tune of Cosmos-Predict2.5-2B for skeleton-conditioned robot video generation. The release includes distributed checkpoint shards (~4 GB), inference code quick-start instructions, 14 benchmark cases, and a case map covering embodiment/start frame/episode mapping.
tasks:
