summary: Song generator from text descriptions and lyrics with inline performance directions. Ranked first on Artificial Analysis' vocal music leaderboard, ahead of Suno v6.
description: ACE Music v1 turns a style description or your own lyrics into a full song. Directions in parentheses such as (hum softly) or (add guitar here) steer how lines are performed. Songs can be exported to MIDI and split into stems in ACE Music. A v1.1 Preview works from melodies and scores (planned in ABC notation). An open-weights ACE Music v1 Flash is planned for late 2026.
