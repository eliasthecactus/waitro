id: physiformer
name: PhysiFormer
org: PhysiFormer
released: 2026-06-08
dateSource: github
summary: PhysiFormer is a diffusion transformer that predicts physically plausible 3D object motion by sampling future vertex trajectories in world coordinates from initial mesh positions velocities and…
description: PhysiFormer casts vertex trajectory prediction as a single denoising diffusion process directly in world coordinates rather than view-dependent pixel or latent space. Given initial vertex positions and velocities plus object material type (rigid or elastic) the model samples future trajectories and captures uncertainty to produce diverse plausible futures. Its attention is factorized over time space and objects for efficiency enabling permutation-invariant multi-object reasoning. Trained on over 100k simulated trajectories it generates rigid and elastic mechanics and generalises to mixed-material settings unseen real-world geometries and larger object counts.
