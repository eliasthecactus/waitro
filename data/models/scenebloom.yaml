summary: SceneBloom is an agentic framework that generates realistic and diverse simulation-ready indoor 3D environments from text prompts by combining FLUX-based visual layout sampling with contract-guided…
description: SceneBloom generates indoor environments for embodied learning. It samples functional zones and layout proposals with FLUX and LoRA adapters, extracts and fits relations, refines layouts, completes wall and small objects, assigns floor and wall materials, renders previews with Genesis, and exports a Habitat-compatible scene.glb. It supports bedroom, living room, dining room, office, and bathroom room types. The pipeline runs on one GPU and uses Qwen3-VL-8B-Instruct through OpenRouter for zoning, relation extraction, and scene completion. LoRA adapters and assets are downloaded separately, and FLUX.1 [dev] requires gated Hugging Face access.
