strengths:
  - Generates simulation-ready indoor 3D scenes and exports them as Habitat-compatible scene.glb
  - "Supports five room types: bedroom living room dining room office and bathroom"
  - Releases LoRA adapters and an extensible asset library under Apache-2.0
limitations:
  - Requires a gated FLUX.1 [dev] model and an OpenRouter API key for Qwen3-VL-8B-Instruct
  - Downloads about 42 GB of third-party models and about 3 GB of SceneBloom assets
  - "The text prompt is limited to five room types: bedroom living room dining room office and bathroom"
