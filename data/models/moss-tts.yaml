summary: MossVLM is a 1.25B-parameter multimodal model for image and video question answering and text reasoning.
description: A decoder-only multimodal reasoning model combining a 1.2B-parameter transformer with a 50M-parameter vision encoder for image/video understanding and text reasoning.
