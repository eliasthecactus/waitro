links:
  repo: https://github.com/OpenMOSS/MOSS-TTS
  weights: https://huggingface.co/OpenMOSS-Team/MOSS-TTS
strengths:
  - Handles mixed image and video inputs in a single prompt
  - Outperforms larger open models on the MMBench-Video benchmark
  - Open weights under a permissive license
limitations:
  - Intended for research and non-production use
  - No audio input supported
  - English-only text output
  - Requires CUDA-capable hardware
