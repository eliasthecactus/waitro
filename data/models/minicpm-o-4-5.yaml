    - apple-silicon
  note: PyTorch inference on NVIDIA GPUs is recommended for 100% precision. On-device options include llama.cpp/Ollama CPU inference, int4 and GGUF quantized models, a realtime web demo deployable on GPUs or Macs and a realtime web demo deployable on GPUs or Macs. The iPhone app is available on the App Store.
links:
  weights: https://huggingface.co/openbmb/MiniCPM-o-4_5
strengths:
  - Achieves 77.6 average OpenCompass score across 8 vision-language benchmarks and supports instruct and thinking modes in one model
  - Supports bilingual English and Chinese real-time speech conversation with configurable voices and voice cloning from a reference audio clip
  - Processes high-resolution images up to 1.8 million pixels and high-FPS videos up to 10fps and reports strong document parsing on OmniDocBench
limitations:
  - Real-time speech conversation is described for English and Chinese only while broader multilingual support is stated for over 30 languages
  - PyTorch inference with 100% precision requires an NVIDIA GPU; CPU and Mac use llama.cpp/Ollama or quantized GGUF paths
  - Full-duplex live streaming requires continuous video and audio input and is shown through local web demos
