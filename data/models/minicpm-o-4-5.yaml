id: minicpm-o-4-5
name: MiniCPM-o 4.5
org: OpenBMB
released: 2026-02-03
dateSource: huggingface
summary: MiniCPM-o 4.5 is a 9B-parameter end-to-end omni-modal MLLM for vision speech and full-duplex multimodal live streaming on phones and local devices.
description: MiniCPM-o 4.5 by OpenBMB is a $9.37B$ parameter omni-modally trained MLLM. It is built end-to-end on SigLip2, Whisper-medium, CosyVoice2 and Qwen3-8B using a TDM full-duplex omni-modal streaming mechanism and is released under the Apache-2.0 license.
