id: alphagenome-2
name: AlphaGenome 2
org: Google DeepMind
released: 2026-11-11
dateSource: vendor
summary: DeepMind DNA sequence model that predicts how genetic variants change gene activity in specific human cell types and states, from a 1M-letter sequence.
description: AlphaGenome 2 is a conditional model. Alongside a million-letter DNA sequence it takes one biological condition (a tissue, cell type or state) chosen from a reference catalog or encoded from a scientist's own single-cell data. Trained on more than 100 million single-cell profiles across 68 tissues. DeepMind says it finds nearly twice as many expression-changing variants as AlphaGenome 1.
