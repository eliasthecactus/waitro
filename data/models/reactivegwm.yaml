id: reactivegwm
name: ReactiveGWM
org: ReactiveGWM authors
released: 2026-05-11
dateSource: github
summary: ReactiveGWM v2 is a diffusion-based game world model built on Wan2.2 that binds control roles to individual characters via initial-frame instance masks and generates reactive gameplay video clips…
description: "ReactiveGWM assigns control roles to individual characters at rollout initialization: Spatial Role Binding grounds learned handles in initial-frame instance masks and Unified Agency Conditioning binds each character's external action sequence or conditional NPC rule to the same handle while causal self-attention lets characters respond to current and preceding video context. The `main` branch holds the v2 HNM and SF3 training and inference code; the original SF2 / Street Fighter Alpha 3 release including bidirectional and Causal Forcing training is preserved on `v1`. Setup targets Python 3.12 with a CUDA GPU and a pinned DiffSynth dependency; the VAE is downloaded from Wan-AI/Wan2.2-TI2V-5B. Inference takes a checkpoint from the INV-WZQ/ReactiveGWM-v2-Models Hugging Face repo with an HNM/main or SF3/main subfolder plus a CSV of samples and can also accept a custom initial image ordered masks and a JSON file assigning actions or NPC prompts to each character. Both game recipes default to 20,000 optimizer updates with effective batch 8 and are configurable through YAML or CLI; released HF weights initialize a new fine-tuning run and do not contain complete optimizer or sampler state. Dataset sizes are HNM 20,000/187/192 and SF3 20,000/200/200."
