strengths:
  - Character-specific control via spatial role binding to initial-frame instance masks
  - Agency conditioning supports external action sequences and conditional NPC rules
  - Causal self-attention lets characters react to current and preceding video context
  - Training and inference code released for HNM and SF3 with Hugging Face weights and datasets
limitations:
  - Released HF weights do not include complete optimizer or sampler state for exact resume
  - Requires a CUDA GPU and the Wan2.2 VAE checkpoint
