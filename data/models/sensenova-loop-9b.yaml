  id: Apache-2.0
  commercial: yes
io:
  in:
    - text
    - image
  out:
    - text
params:
  total: 9.66
contextTokens: 262144
hardware:
  platforms:
    - cuda
  note: Checked environment uses Transformers 5.18.0 and PyTorch 2.11.0 with CUDA 13.0; single-GPU example given, with four-GPU LightLLM and SGLang serving examples.
links:
  repo: https://github.com/OpenSenseNova/SenseNova-Loop
  weights: https://huggingface.co/sensenova/SenseNova-Loop-9B-Preview
strengths:
  - Shared-weight looped block gives 56 decoder-layer executions from 32 distinct layers without duplicating weights
  - Documented multimodal training at sequence lengths up to 262K tokens
  - MTP speculative decoding is available for accelerated inference
limitations:
  - Execution depends on checkpoint-specific loop range pass count and mHC routing parameters that a compatible implementation must reproduce
  - Dspark and Dflash2 acceleration methods are still training in progress
  - Requires trust_remote_code with the custom SenseNova Loop implementation
