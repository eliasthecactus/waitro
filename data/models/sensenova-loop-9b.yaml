id: sensenova-loop-9b
name: SenseNova-Loop 9B
org: OpenSenseNova
released: 2026-10-28
dateSource: huggingface
summary: A 9B-parameter autoregressive multimodal decoder that runs a shared 24-layer block twice for 56 layer executions per pass and targets long-context document understanding and agentic tool use.
description: SenseNova-Loop-9B-Preview is an autoregressive multimodal decoder from OpenSenseNova that accepts text and images and generates text, aimed at document understanding, coding and external tool interaction. It combines a shared-weight looped decoder block (layers applied twice) with two-stream manifold-constrained hyper-connections and hybrid linear/full attention in a repeating four-layer pattern. Training recipes documented by the authors use sequences up to 262,144 tokens covering text, images, code and tool trajectories.
tasks:
