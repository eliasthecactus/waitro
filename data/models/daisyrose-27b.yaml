summary: Qwen3.8-27B post-trained with reinforcement learning only on about 1,200 long-horizon agent tasks. Drop-in replacement that scores higher on coding and agent benchmarks.
description: Multimodal reasoning model trained with RL only (no SFT or distillation) using RadixArk's Miles framework, 18 days on 144 H200 GPUs. Same architecture, tokenizer, chat template and 256K context as Qwen3.8-27B. Runs on a single GPU from H200 down to RTX 5090 and DGX Spark.
