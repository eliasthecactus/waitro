strengths:
  - Generates and edits images natively up to 4K resolution with coherent structure and lighting
  - Legible Chinese and English text rendering suited to posters infographics and brand assets
  - Precise region- and object-level control via bounding boxes visual markers and single- or multi-image references
  - Editing preserves subject identity and unedited content across local text insertion and replacement edits
limitations:
  - Some prompts yield excessive high-frequency detail or oversaturated colors which can be mitigated by lowering cfg_scale
  - Dense lengthy small or mixed Chinese-English text in images may contain errors
  - Broad multi-turn or multi-reference edits may drift when many regions must be preserved
  - Small faces hands limbs and fine object structures may remain unstable
