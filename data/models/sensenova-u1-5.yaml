summary: SenseNova U1.5 (8B-MoT) is a native unified multimodal image generation and editing model that produces high-fidelity images with strong text rendering and supports precise instruction-based edits.
description: SenseNova U1.5 (8B-MoT) is a native unified multimodal checkpoint built on the NEO-unify architecture for high-quality image generation and reliable instruction-based image editing.
