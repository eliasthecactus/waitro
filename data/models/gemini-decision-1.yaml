summary: Google model behind the Gemini Decisions API. Scores yes/no, multiple-choice and rubric questions over multimodal input in one pass, with calibrated probabilities.
description: Instead of generating text, Gemini Decision 1 scores candidate options in a single forward pass and returns probabilities and confidence scores. One request takes one shared input (text, images, audio, video or PDF, up to 256K tokens) and up to 1,000 independent questions. Built for routing, tool selection, policy checks, grading and moderation. Model id gemini-decision-1.
