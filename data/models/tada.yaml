id: tada
name: TADA
org: Hume
released: 2026-01-12
dateSource: huggingface
summary: TADA is a unified speech-language model (TADA-1B based on Llama 3.2 1B) that uses 1:1 text-acoustic token alignment for dynamic-duration text-to-speech and dual-stream speech generation.
description: TADA synchronizes speech and text into a single stream via 1:1 token alignment. Its tokenizer encodes audio into vectors matching the number of text tokens. As a TTS model it generates the full speech segment for a text token in a single autoregressive step regardless of length. In speech-language modeling mode it generates a text token and the speech for the preceding token simultaneously. Checkpoints include TADA-1B (Llama 3.2 1B) and TADA-3B-ml (Llama 3.2 3B) and all use the HumeAI/tada-codec encoder.
tasks:
  - text-to-speech
architecture: transformer
access: open-weights
license:
  id: Llama-3.2
  commercial: limited
  note: Llama 3.2 Community License
io:
  in:
    - text
    - audio
  out:
    - audio
params:
  total: 2.16
hardware:
  platforms:
    - cuda
  note: Inference examples use device = "cuda".
links:
  weights: https://huggingface.co/HumeAI/tada-1b
  homepage: https://www.hume.ai/blog/opensource-tada
strengths:
  - 1:1 token alignment between text and audio enables dynamic duration synthesis
  - Generates the full speech segment for a text token in a single autoregressive step
  - Dual-stream mode produces text and speech simultaneously with minimal overhead
limitations:
  - Llama 3.2 Community License imposes commercial-use restrictions including user caps and attribution
  - Inference examples require a CUDA GPU
notes: Drafted from the model card; date, licence and size taken from Hugging Face/GitHub metadata.
