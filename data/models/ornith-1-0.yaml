description: Ornith-1.0-397B is the largest member of the Ornith 1.0 family of open-source agentic coding models, post-trained on top of Gemma 4 and Qwen 3.5. It is a reasoning model whose assistant turn opens with a block before the final answer, and it emits <tool_call> blocks that servers parse into OpenAI-style tool_calls. The card reports state-of-the-art results among open-source models of comparable size on Terminal-Bench 2.1, SWE-bench Verified/Pro/Multilingual, NL2Repo, Claw-eval and SWE Atlas, and documents OpenAI-compatible serving recipes for vLLM, SGLang and Hugging Face Transformers on a single 8x80GB GPU node with tensor parallelism.
