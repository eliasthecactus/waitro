id: laya
name: Laya
org: Convai Innovations
released: 2026-09-18
dateSource: huggingface
summary: Laya is a family of small non-autoregressive encoder models (421M-parameter ModernBERT-large English checkpoint and 322M-parameter mmBERT-base multilingual checkpoint) that answers typed questions…
description: "Trained with RLCD against strictly proper scoring rules, Laya never generates text and instead returns answers for question types: choice, score and yes/no probabilities, plus routing metadata. The repository holds three checkpoints: `convaiinnovations/laya` (English checkpoint at 512 tokens), `convaiinnovations/laya-multilingual` (100+ languages with 1,024-token context, extendable to 8,192 tokens), and `convaiinnovations/laya-typed-decisions` (the four typed-decisions workflows, reported at 0.766 accuracy versus 0.362 for the base English checkpoint). A `Router` detects script and language and sends input to the checkpoint that fits before inference."
