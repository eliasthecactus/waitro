  note: GPU CUDA path with TileLang fast path; ONNX Runtime optional extra; CPU fallback after CUDA OOM; Apple GPU referenced for long-document runs.
links:
  weights: https://huggingface.co/convaiinnovations/laya
  homepage: https://laya.convaiinnovations.com/
strengths:
  - Calibrated probability outputs through single-pass inference at roughly 33 ms
  - Non-generative so nothing to parse and nothing to hallucinate
  - Router dispatches across checkpoints for 100+ languages
limitations:
  - The English checkpoint is weak on non-Latin scripts
  - "Short context windows are limiting: 512 tokens on the English root checkpoint and 1 ·024 defaults on the other two unless `max_len=8192` is set"
  - The shipped checkpoints are zero-shot and need fine-tuning for higher accuracy in a specific domain
