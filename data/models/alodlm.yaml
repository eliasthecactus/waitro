  - coding
  - chat
architecture: hybrid
access: open-weights
license:
  id: CC-BY-NC-4.0
  commercial: no
io:
  in:
    - text
  out:
    - code
    - text
params:
  total: 8.19
contextTokens: 8192
hardware:
  platforms:
    - cuda
  note: Requires NVIDIA CUDA BF16 GPU; optimized 8B path checked on A100 40GB
links:
  weights: https://huggingface.co/amazon/ALoDLM-8B
strengths:
  - Uses adaptive recurrent computation to refine unresolved tokens while committed tokens provide context
  - Reports 94.4 on ARC-Challenge and 87.8 on HumanEval for the 8B model
  - Available in 1.7B and 8B sizes initialized from Qwen3 backbones
limitations:
  - Licensed CC BY-NC 4.0 for noncommercial use only
  - Requires an NVIDIA CUDA GPU with BF16 support and sufficient memory
  - Intended for research; benchmarks do not establish autonomous or high-consequence readiness
