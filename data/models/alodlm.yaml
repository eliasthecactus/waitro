id: alodlm
name: ALoDLM
org: Amazon
released: 2026-10-02
dateSource: huggingface
summary: ALoDLM-8B is an 8.19B-parameter diffusion language model from Amazon that generates text and code by adaptively looping shared transformer layers.
tasks:
