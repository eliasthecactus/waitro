id: timestral
name: Timestral
org: Mistral AI
released: 2026-10-14
dateSource: huggingface
summary: Time-series foundation models (5M to 209M) for zero-shot, multivariate, probabilistic forecasting.
description: |
  Supports past and known-future covariates and 21 quantiles, up to 32,768 historical steps and 1,024 forecast steps
  per pass. Mistral reports state-of-the-art zero-shot accuracy on GIFT-Eval, TIME and fev-bench.
tasks: [forecasting]
architecture: transformer
access: open-weights
license: { id: Modified-MIT, commercial: limited, note: "Not licensed for companies with over $20M monthly revenue." }
