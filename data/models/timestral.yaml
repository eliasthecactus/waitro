  - { name: 28M, params: 0.028, weights: https://huggingface.co/mistralai/Timestral-28M }
  - { name: 123M, params: 0.123, weights: https://huggingface.co/mistralai/Timestral-123M }
  - { name: 209M, params: 0.209, weights: https://huggingface.co/mistralai/Timestral-209M }
links:
  weights: https://huggingface.co/mistralai/Timestral-209M
strengths: [Tiny sizes run anywhere, Covariates and probabilistic output]
