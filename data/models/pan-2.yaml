id: pan-2
name: PAN 2
org: MBZUAI Institute of Foundation Models
released: 2026-11-05
dateSource: github
summary: Open world model that simulates how a scene changes in response to actions described in text, as video up to 20 s. Built on a 29B MMDiT trained from scratch.
description: PAN 2 follows the Generative Latent Prediction design. An LLM (the conceptual reasoner) writes the next world state as a structured, time-grounded description of events, actions and camera motion; a 29B MMDiT then predicts the video latents, decoded by the Wan 2.2 VAE at 704x1248 and 24 fps. Agents can simulate several candidate plans and pick the best. One checkpoint does text-to-video and image-to-video; Qwen3.5-9B serves as the frozen text encoder. Supported in Diffusers and vLLM.
