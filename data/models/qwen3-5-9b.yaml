license:
  id: Apache-2.0
  commercial: yes
io:
  in:
    - text
    - image
  out:
    - text
params:
  total: 9.65
contextTokens: 262144
hardware:
  platforms:
    - cuda
  note: Card recommends vLLM SGLang or KTransformers for production serving and warns that the default 262144-token context can cause OOM.
links:
  weights: https://huggingface.co/Qwen/Qwen3.5-9B
strengths:
  - Early-fusion vision-language foundation model with reported strong OCR and document benchmark scores
  - Native 262144-token context extensible to 1010000 tokens
  - Apache-2.0 licence allows commercial use
limitations:
  - Default thinking mode generates reasoning content before final answers
  - Default 262K context can cause OOM and may need reduction
  - Recent serving framework versions are required for optimal compatibility
notes: Drafted from the model card; date, licence and size taken from Hugging Face/GitHub metadata.
