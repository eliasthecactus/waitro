id: qwen3-5-9b
name: Qwen3.5-9B
org: Alibaba
released: 2026-02-27
dateSource: huggingface
summary: Qwen3.5-9B is a 9B-parameter hybrid vision-language causal model from Alibaba with a native 262144-token context and Apache-2.0 weights.
description: Qwen3.5-9B is a causal language model with a vision encoder, trained with early fusion on multimodal tokens. Per the authors its hybrid design combines Gated Delta Networks with sparse Mixture-of-Experts and it supports 201 languages and dialects. The card reports a native 262144-token context extensible to 1010000 tokens and benchmark results for language reasoning coding agents and vision-language tasks.
tasks:
