strengths:
  - Recovers multi-person 3D motion in the form of SMPL-X bodies from calibrated multi-view video
  - Combines SAM/YOLO segmentation MammaNet 2D landmarks and multi-view optimization in one runnable pipeline
  - Includes training code plus synthetic and real capture datasets
limitations:
