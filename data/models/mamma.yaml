summary: MAMMA is a multi-view markerless motion-capture pipeline that combines SAM/YOLO segmentation with MammaNet 2D landmark detection and multi-view SMPL-X optimization to recover accurate multi-person…
description: "MAMMA (Markerless Accurate Multi-person Motion Acquisition) is a CVPR 2026 pipeline released with inference and training code. It runs as a five-step chain: ma_cap loads multi-view captures, ma_masks performs per-person segmentation with SAM + YOLO, ma_2d detects 2D landmarks with MammaNet, ma_3d runs multi-view SMPL-X optimization, and ma_vis renders per-camera overlays and an interactive 3D scene. Runs are driven by `python -m inference run` with a preset YAML, a footage directory and a calibration file, and a browser GUI (Flask + React) is included for submitting and inspecting runs. The accompanying dance, multi-person, iPhone, eval and synthetic datasets are hosted on the project page behind a free account."
