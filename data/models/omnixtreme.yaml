summary: OmniXtreme is a unified policy framework with released pretrained checkpoints for high-dynamic humanoid motion tracking plus sim-to-sim evaluation code.
description: OmniXtreme is a policy framework for high-dynamic humanoid motion tracking. The repository releases a paper with demonstration videos, pretrained policy checkpoints under `policy/`, and sim-to-sim evaluation code; the provided policy is trained with the OmniXtreme framework on high-dynamic motions. Setup requires a conda environment with CUDA/cuDNN, the curated motion data placed in the policy directory, and a MuJoCo rollout via `deploy_mujoco.py`. Flow matching base policy training/inference code, residual post-training code and C++ real-world deployment code are listed only as planned future releases.
