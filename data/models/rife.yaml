io: { in: [video], out: [video] }
hardware:
  platforms: [cuda, apple-silicon, cpu, rocm]
  note: rife-ncnn-vulkan builds run on Macs.
links:
  repo: https://github.com/hzwer/Practical-RIFE
  paper: https://github.com/hzwer/ECCV2022-RIFE
strengths: [Fast, Runs on almost anything, Built into many tools]
limitations: [Artifacts on very fast motion]
