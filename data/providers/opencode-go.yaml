id: opencode-go
name: OpenCode Go
org: Anomaly (OpenCode)
hq: USA
kind: subscription
summary: Low-cost monthly plan for 30+ coding models (GLM, Kimi, DeepSeek, Qwen, MiniMax plus Claude Haiku and GPT Luna), usable in OpenCode, Claude Code, Codex and Hermes.
description: |
  Each model has its own monthly allowance in dollars at Zen list prices, for example $15 of GLM 5.3 or $100 of DeepSeek V4.1 Flash on Go. Any 5-hour window can use up to 20% of it and any week up to 50%. When you hit a limit you can keep going on free models or turn on Extra Usage, which bills your pay-as-you-go balance.

  Go is meant for coding agents: clients must send their own user agent and a stable session id. Claude Code, Codex, Hermes, Pi, jcode and Kilo Code CLI are tested; DeepSeek Harness, GitHub Copilot Chat, Kimi Code and MiMo Code are known to have problems.
billing:
  types: [subscription]
  note: Cancel any time. Refund within 14 days if you used almost none of the allowance.
plans:
  - { name: Go, price: 10, period: month }
  - { name: Go Plus, price: 40, period: month, note: About 4x the Go limits }
  - { name: Go Teams, price: 20, period: seat-month, note: "Own limits per member, Extra Usage on" }
api: [openai, openai-responses, anthropic, google]
baseUrl: https://opencode.ai/inference/go/
