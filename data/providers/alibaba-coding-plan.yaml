  - { id: qwen3-8-max, name: Qwen3.8 Max, note: 60% fewer credits 22:00 to 08:00 UTC+8 }
  - { name: Qwen3.8 Flash, note: 60% fewer credits 22:00 to 08:00 UTC+8 }
  - { id: qwen3-7-max, name: Qwen3.7 Max }
  - { id: deepseek-v4-1-flash, name: DeepSeek V4.1 Flash, note: Half credits at night }
  - { id: deepseek-v4-pro, name: DeepSeek V4 Pro, note: Half credits at night }
  - { id: glm-5-3, name: GLM 5.3 }
pricesSource: https://www.alibabacloud.com/help/en/model-studio/token-plan-personal-overview
privacy: Team Edition says conversation data is not used for model training. Personal Edition terms not checked.
worksWith: [claude-code, codex, qwen-code, openclaw, hermes-agent, deepseek-harness, cursor]
strengths: [Very cheap entry tiers, Several model families in one plan, Night discounts on Qwen and DeepSeek]
limitations: [Interactive tool use only, No cancellation or downgrade on Personal Edition, Credit cost per request not published]
links:
