id: alibaba-coding-plan
name: Alibaba Cloud Token Plan
org: Alibaba Cloud (Model Studio)
hq: China / Singapore
kind: subscription
summary: Alibaba Model Studio subscription billed in Credits for Qwen4 Max, Qwen3.8, DeepSeek V4 and GLM 5.3 in Claude Code, Codex, Qwen Code, OpenClaw and Hermes. From $6 a month.
description: |
  Token Plan replaces the older Coding Plan, which now only sells a $50 Pro tier with limited daily slots. Each Token Plan tier has a monthly Credit quota; credits used per request depend on model, tokens, thinking mode and tool calls. There is no weekly limit since 2026-09-22 and quota does not roll over. Extra bundles cost $15 for 20,000 Credits.

  Use is limited to interactive work in coding and agent tools; scripts, app backends and batch calls are not allowed. The plan also covers image, video and speech models and built-in tools like web search and a code interpreter. Personal and Team editions run in the Singapore region.
billing:
  types: [subscription]
  note: Monthly, quarterly or yearly. Personal Edition cannot be cancelled or downgraded.
plans:
  - { name: Lite, price: 6, period: month, note: "20,000 Credits, 1 to 2 agents; $3 for new users until 2026-11-30" }
  - { name: Essential, price: 10, period: month, note: "45,000 Credits, 2 to 3 agents; $5 for new users until 2026-11-30" }
  - { name: Standard, price: 18, period: month, note: "80,000 Credits, 3 to 4 agents" }
  - { name: Pro, price: 43, period: month, note: "200,000 Credits, 6 to 8 agents" }
  - { name: Team Standard, price: 20, period: seat-month, note: "25,000 Credits per seat" }
  - { name: Team Advanced, price: 75, period: seat-month, note: "100,000 Credits per seat" }
  - { name: Team Premium, price: 180, period: seat-month, note: "250,000 Credits per seat" }
  - { name: Coding Plan Pro (legacy), price: 50, period: month, note: "6,000 requests per 5 hours, 45,000 a week, 90,000 a month; older Qwen, Kimi, GLM and MiniMax models" }
api: [anthropic, openai, openai-responses]
