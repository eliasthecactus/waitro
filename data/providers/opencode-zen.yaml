id: opencode-zen
name: OpenCode Zen
org: Anomaly (OpenCode)
hq: USA
kind: router
summary: Pay-as-you-go gateway from the OpenCode team with a hand-picked set of models tested for coding agents, including Claude, GPT, Gemini and open models.
description: |
  You add credit in the OpenCode console, copy one API key and use the opencode/ models in OpenCode or any other client. Zen exposes OpenAI (Chat and Responses), Anthropic Messages and Google endpoints and translates between them, so every text model works through any of the three.

  Some models are free for a limited time, but those only work inside OpenCode. Budgets can be capped per workspace and per member.
billing:
  types: [prepaid]
  fee: "4.6% + $0.31 on each credit purchase"
  freeTier: Several free models for a limited time, usable in OpenCode only
  note: Auto-reload and monthly spend limits per workspace and member.
api: [openai, openai-responses, anthropic, google]
baseUrl: https://opencode.ai/inference
