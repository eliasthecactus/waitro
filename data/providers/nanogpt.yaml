kind: router
summary: Pay-as-you-go access to about 1,300 models with no markup and deposits from $0.10 in crypto, plus a $12 PRO plan with free output on open models.
description: |
  Top up a balance by card or crypto and use any model on the web or through OpenAI- and Anthropic-compatible APIs. Text prices are list prices; pinning a specific provider adds 5%, and bring-your-own-key requests cost 5% of the normal price.

  PRO ($12 a month) includes 60M input tokens a week on open text models (GLM, DeepSeek, Kimi, MiniMax, MiMo, Qwen and more) with free output, 100 images a day and 5% off other text models. Closed models like Claude and GPT still bill from your balance.
