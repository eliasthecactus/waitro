id: baseten
name: Baseten Model APIs
org: Baseten
hq: USA
kind: inference
summary: Per-token Model APIs for popular open models (GLM, DeepSeek, Kimi, Nemotron, gpt-oss) with Fast variants, on the same platform that runs dedicated deployments.
description: |
  Model APIs are pay as you go per token with no contract. Several models come in a Fast variant at a higher price. Larger customers can get volume discounts, reserved and priority compute.

  The API is OpenAI-compatible. An Anthropic Messages endpoint is in beta. Claude Code and Codex connect through Baseten Switch, a local gateway app for macOS (beta); OpenCode, Pi and Droid connect directly.
billing:
  types: [payg]
  note: Usage-based, no contract. Volume pricing on request.
api: [openai, anthropic]
baseUrl: https://inference.baseten.co/v1
