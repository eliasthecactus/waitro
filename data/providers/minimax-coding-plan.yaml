id: minimax-coding-plan
name: MiniMax M Plan
org: MiniMax
hq: China
kind: subscription
summary: MiniMax subscription (formerly Coding Plan, then Token Plan) for MiniMax M3.1 Flash in Claude Code, Codex, Cursor, OpenCode, Hermes and OpenClaw, plus image, video and speech. From $22 a month.
description: |
  Three tiers share the same models and differ in quota: Explore has 3x the Go quota and Build 7.5x. Text and speech count against both a 5-hour and a weekly window; image and video only against the weekly one. Windows start at first use and quota does not roll over.

  When you hit a limit you can wait, upgrade, spend Credits on supported models or switch to a pay-as-you-go API key. M Plan keys only work for the plan, not for production apps. Token Plan is closed to new buyers; existing subscribers can keep it or upgrade.
billing:
  types: [subscription]
  note: Monthly or annual. Annual billing charges 10 months for 12.
plans:
  - { name: Go, price: 22, period: month, note: "1x quota, M3.1 Flash, H3 Image, speech; no video" }
  - { name: Explore, price: 55, period: month, note: "3x Go quota, adds H3 video and H3 Image Highspeed" }
  - { name: Build, price: 132, period: month, note: "7.5x Go quota, same models as Explore" }
api: [anthropic, openai]
baseUrl: https://api.minimax.io/anthropic
models:
  - { id: minimax-m3-1-flash, name: MiniMax M3.1 Flash, note: "All tiers, 1M context in Claude Code" }
  - { id: minimax-h3, name: MiniMax H3 (video), note: Explore and Build only }
  - { id: minimax-h3-image, name: MiniMax H3 Image, note: All tiers }
pricesSource: https://platform.minimax.io/docs/m-plan/monthly-offer
privacy: Platform terms say inputs are processed only to provide the service, for maintenance and support, and for legal compliance; training is not listed. The privacy policy says personal data is stored in a US data center and gives no fixed retention period.
worksWith: [claude-code, codex, cursor, opencode, hermes-agent, openclaw]
strengths: [Text and media generation in one plan, Official guides for the main coding agents]
limitations: [Only one text model (M3.1 Flash), Exact quota numbers not published, Separate rate limits can hit before the quota]
links:
  homepage: https://www.minimax.io/m-plan
  docs: https://platform.minimax.io/docs/m-plan/intro
notes: "Prices from the monthly offer page (regular price after the launch discount that ended 2026-10-14); annual totals of $220, $550 and $1,320 are derived from the 10-for-12 rule, not shown directly. Absolute 5-hour and weekly quotas are only shown in the console. MiniMax also has its own MiniMax Code client. The OpenAI-compatible base URL for M Plan keys is https://api.minimax.io/v1 (Other tools guide). The platform is run by Nanonoble Pte. Ltd. in Singapore; the M Plan docs have no separate data terms."
tags: [coding-plan, minimax]
lastChecked: 2026-11-19
