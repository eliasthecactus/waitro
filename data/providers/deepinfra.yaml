summary: Low-cost per-token inference for open models with no contracts, plus dedicated GPUs by the hour. Priority and flex tiers trade price for speed.
description: Pay per token for language models and per second for others, with no upfront cost. Requests can run on the standard tier, a priority tier (1.5x price, faster first token) or a flex tier (0.8x). Dedicated GPUs start at $1.49 an hour for an A100.
