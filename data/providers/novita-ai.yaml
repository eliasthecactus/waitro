notes: The Anthropic base is https://api.novita.ai/anthropic. The LLM API reference uses https://api.novita.ai/v3/openai while the OpenCode and Codex guides use https://api.novita.ai/openai/v1. The pricing page says "Free to start" but gives no free credit amount. HQ (USA) not confirmed on an official page. The privacy policy page did not load; a third-party summary says no training on customer content and zero retention by default.
